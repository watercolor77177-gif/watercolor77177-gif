  function renderCal() {
    const root = $('#view-cal');
    if (!root.dataset.built) { root.innerHTML = calShell(); root.dataset.built = '1'; }
    const p = S.calMonth.split('-').map(Number);
    $('#calM').textContent = p[1];
    $('#calEn').textContent = monthName(p[1] - 1);
    $('#calY').textContent = p[0];
    $('#calTitle').setAttribute('aria-label', p[0] + '년 ' + p[1] + '월');
    $('#calTodayBtn').hidden = S.calMonth === today().slice(0, 7) && S.calSel === today();
    $('#calWeeks').innerHTML = calWeeksHTML(S.calMonth);
    $('#agenda').innerHTML = agendaHTML(S.calSel);
    $('#upcoming').innerHTML = upcomingHTML();
  }

  function calWeeksHTML(ym) {
    const first = ym + '-01', gs = weekStartOf(first);
    const fd = parse(first), last = ymd(new Date(fd.getFullYear(), fd.getMonth() + 1, 0));
    const weeks = Math.ceil((diffDays(gs, last) + 1) / 7);
    const evs = eventList(), t = today(), MAXL = 3;
    let html = '';
    for (let w = 0; w < weeks; w++) {
      const ws = addDays(gs, w * 7), we = addDays(ws, 6);
      const multi = evs.filter(e => isMulti(e) && e.date <= we && evEnd(e) >= ws)
        .sort((a, b) => a.date.localeCompare(b.date) || evEnd(b).localeCompare(evEnd(a)) || str(a.title).localeCompare(str(b.title)));
      const laneEnd = [], segs = [];
      multi.forEach(e => {
        const s = Math.max(0, diffDays(ws, e.date)), en = Math.min(6, diffDays(ws, evEnd(e)));
        let lane = laneEnd.findIndex(x => x < s);
        if (lane < 0) { lane = laneEnd.length; laneEnd.push(en); } else laneEnd[lane] = en;
        segs.push({ e: e, s: s, en: en, lane: lane });
      });
      const lanes = Math.min(laneEnd.length, MAXL);
      const hidden = [0, 0, 0, 0, 0, 0, 0];
      segs.forEach(x => { if (x.lane >= MAXL) for (let i = x.s; i <= x.en; i++) hidden[i]++; });
      let cells = '';
      for (let i = 0; i < 7; i++) {
        const d = addDays(ws, i), hol = HOLIDAYS[d];
        const cls = ['cal-day'];
        if (d.slice(0, 7) !== ym) cls.push('out');
        if (i === 0) cls.push('sun');
        if (i === 6) cls.push('sat');
        if (hol) cls.push('hol');
        if (d === t) cls.push('today');
        if (d === S.calSel) cls.push('sel');
        const singles = evs.filter(e => !isMulti(e) && e.date === d).sort(evSort);
        const total = singles.length + segs.filter(x => x.s <= i && x.en >= i).length;
        const more = Math.max(0, singles.length - 3) + hidden[i];
        const rec = dayHasRecord(D.days[d]);
        const term = SKIN.almanac && !hol ? TERMS[d] : '';
        cells += '<button type="button" class="' + cls.join(' ') + '" data-action="cal-select" data-date="' + d + '" aria-pressed="' + (d === S.calSel) + '" aria-label="' + fmtMD(d) + (hol ? ', ' + hol : '') + (term ? ', ' + term : '') + (total ? ', 일정 ' + total + '개' : '') + (rec ? ', 기록 있음' : '') + '">' +
          '<span class="cd-num">' + parse(d).getDate() + '</span>' +
          (rec ? '<span class="cd-rec" aria-hidden="true"></span>' : '') +
          (hol ? '<span class="cd-hol">' + esc(hol === '대체공휴일' ? '대체휴일' : hol) + '</span>' : '') +
          (term ? '<span class="cd-hol cd-term">' + term + '</span>' : '') +
          '<span class="cd-marks">' + singles.slice(0, 3).map(e => '<span class="cd-ev type-' + typeOf(e) + '"><span class="cd-dot"></span><span class="cd-t">' + esc(e.title) + '</span></span>').join('') +
          (more ? '<span class="cd-more">+' + more + '</span>' : '') + '</span>' +
        '</button>';
      }
      const bars = segs.filter(x => x.lane < MAXL).map(x => {
        const contL = x.e.date < ws, contR = evEnd(x.e) > we;
        return '<span class="cal-bar type-' + typeOf(x.e) + (contL ? ' cont-l' : '') + (contR ? ' cont-r' : '') + '" style="--s:' + x.s + ';--n:' + (x.en - x.s + 1) + ';--lane:' + x.lane + '">' + esc(x.e.title) + '</span>';
      }).join('');
      html += '<div class="cal-week" style="--lanes:' + lanes + '"><div class="cal-days">' + cells + '</div><div class="cal-bars" aria-hidden="true">' + bars + '</div></div>';
    }
    return html;
  }

  const agendaItemHTML = (e, d) => '<li><button type="button" class="agenda-item type-' + typeOf(e) + '" data-action="edit-event" data-id="' + esc(e.id) + '">' +
    '<span class="ai-time">' + esc(evTimeLabel(e, d)) + '</span>' +
    '<span class="ai-main"><span class="ai-title">' + esc(e.title) + '</span>' + ((e.place || e.memo) ? '<span class="ai-sub">' + esc([e.place, e.memo].filter(Boolean).join(' · ')) + '</span>' : '') + '</span>' +
    '<span class="ai-type">' + TYPES[typeOf(e)] + '</span></button></li>';

  function agendaHTML(d) {
    const evs = eventsOn(d), hol = HOLIDAYS[d];
    const tds = todoList().filter(x => x.due === d).sort((a, b) => ((a.done ? 1 : 0) - (b.done ? 1 : 0)) || todoSort(a, b));
    const lunar = SKIN.almanac ? lunarLabel(d) : '';
    const term = SKIN.almanac ? TERMS[d] : '';
    return '<div class="agenda-head"><h2 class="sec-title"><span>' + fmtMD(d) + (lunar || term ? '<small class="ag-lunar">' + esc([lunar, term].filter(Boolean).join(' · ')) + '</small>' : '') + '</span></h2>' + (hol ? '<span class="hol-badge">' + esc(hol) + '</span>' : '') + '</div>' +
      (evs.length ? '<ul class="agenda-list">' + evs.map(e => agendaItemHTML(e, d)).join('') + '</ul>' : '<p class="empty">이 날은 잡힌 일정이 없어요.</p>') +
      (tds.length ? '<h3 class="sub-title agenda-sub">할 일</h3><ul class="todo-list">' + tds.map(x => todoItemHTML(x, false)).join('') + '</ul>' : '') +
      '<div class="agenda-actions"><button type="button" class="btn primary" data-action="add-event" data-date="' + d + '">' + ICON.plus + '일정 추가</button><button type="button" class="btn" data-action="open-diary" data-date="' + d + '">이 날 다이어리</button></div>';
  }

  function upcomingHTML() {
    const t = today(), lim = addDays(t, 45);
    const key = e => (e.date < t ? t : e.date);
    const list = eventList().filter(e => evEnd(e) >= t && e.date <= lim)
      .sort((a, b) => key(a).localeCompare(key(b)) || evSort(a, b)).slice(0, 6);
    return '<h2 class="sec-title"><span>다가오는 일정</span></h2>' + (list.length ? '<ul class="up-list">' + list.map(e => {
      const n = diffDays(t, e.date), dd = n > 0 ? 'D-' + n : n === 0 ? 'D-day' : '진행 중';
      const when = fmtShort(e.date) + (isMulti(e) ? ' – ' + fmtShort(evEnd(e)) : '') + (!isMulti(e) && !e.allDay && e.start ? ' · ' + e.start : '');
      const sd = parse(e.date);
      return '<li><button type="button" class="up-item type-' + typeOf(e) + '" data-action="edit-event" data-id="' + esc(e.id) + '">' +
        '<span class="up-date"><b>' + sd.getDate() + '</b><small>' + WD[sd.getDay()] + '</small></span>' +
        '<span class="up-main"><span class="up-title">' + esc(e.title) + '</span><span class="up-sub">' + when + '</span></span>' +
        '<span class="up-dday">' + dd + '</span></button></li>';
    }).join('') + '</ul>' : '<p class="empty">앞으로 45일 안에 잡힌 일정이 없어요.</p>');
  }

  function shiftMonth(n) {
    const p = S.calMonth.split('-').map(Number);
    S.calMonth = ymd(new Date(p[0], p[1] - 1 + n, 1)).slice(0, 7);
    const t = today();
    S.calSel = t.slice(0, 7) === S.calMonth ? t : S.calMonth + '-01';
    updateWindows();
    renderCal();
  }

  /* ---------------- actions ---------------- */
  function goDate(d) {
    if (!isValidDate(d)) return;
    S.date = d;
    updateWindows();
    render();
  }
  function dayForEdit() { return clone(getDay(S.date)) || emptyDay(S.date); }
  function addTodo(title, due, star) {
    Store.save('todos', newId(), { title: title, due: due || '', star: !!star, done: false, doneAt: 0, createdAt: Date.now() });
    scheduleRender();
  }
  function toggleTodo(id, done) {
    const cur = D.todos[id];
    if (!cur) return;
    const t = clone(cur);
    t.done = done;
    t.doneAt = done ? Date.now() : 0;
    Store.save('todos', id, t);
    scheduleRender();
  }
  function toggleRoutine(rid, on) {
    const day = dayForEdit();
    day.routines = Object.assign({}, day.routines);
    if (on) day.routines[rid] = true; else delete day.routines[rid];
    Store.save('days', S.date, day);
    scheduleRender();
  }
  function setMood(n) {
    const day = dayForEdit();
    day.mood = day.mood === n ? 0 : n;
    Store.save('days', S.date, day);
    scheduleRender();
  }
  function setWater(n) {
    const day = dayForEdit();
    day.water = day.water === n ? n - 1 : n;
    Store.save('days', S.date, day);
    scheduleRender();
  }
  function overdueToToday() {
    const t = today();
    let n = 0;
    Object.keys(D.todos).forEach(id => {
      const td = D.todos[id];
      if (td && !td.done && td.due && td.due < t) { const c = clone(td); c.due = t; Store.save('todos', id, c); n++; }
    });
    if (n) toast('지난 할 일 ' + n + '개를 오늘로 옮겼어요.');
    scheduleRender();
  }
  function deleteWithUndo(items, msg) {
    const backup = items.map(x => ({ kind: x.kind, id: x.id, data: clone(D[x.kind][x.id]) })).filter(x => x.data);
    if (!backup.length) return;
    backup.forEach(x => Store.remove(x.kind, x.id));
    scheduleRender();
    toast(msg, '되돌리기', () => { backup.forEach(x => Store.save(x.kind, x.id, x.data)); scheduleRender(); });
  }
  function clearDone() {
    const items = Object.keys(D.todos).filter(id => D.todos[id] && D.todos[id].done).map(id => ({ kind: 'todos', id: id }));
    if (items.length) deleteWithUndo(items, '완료한 할 일 ' + items.length + '개를 비웠어요.');
  }
  function clearExamples() {
    const items = [];
    ['todos', 'events'].forEach(kind => Object.keys(D[kind]).forEach(id => { if (D[kind][id] && D[kind][id].example) items.push({ kind: kind, id: id }); }));
    if (S.sheet) closeSheet();
    if (items.length) deleteWithUndo(items, '예시 ' + items.length + '개를 지웠어요.');
  }
  function pickDue(group, val) {
    if (group === 'nd') { S.todoDraft.due = val; renderTodoForm(); }
    else if (group === 'ed' && S.sheet && S.sheet.kind === 'todo') {
      S.sheet.due = val;
      const box = $('#tdDue');
      if (box) box.innerHTML = dueChipsHTML('ed', val);
    }
  }

  /* ---------------- toast ---------------- */
  let toastTimer = 0;
  function toast(msg, actionLabel, onAction) {
    const el = $('#toast');
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (actionLabel ? '<button type="button" id="toastAct">' + esc(actionLabel) + '</button>' : '');

  async function exportBackup() {
    const name = (SKIN.backupName || 'planner') + '-backup-' + today() + '.json';
    const text = JSON.stringify({ app: SKIN.id || 'planner', version: 1, exportedAt: new Date().toISOString(), settings: D.settings, days: D.days, todos: D.todos, events: D.events });
    let file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.share) {
      try {
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: name });
          toast('백업 파일을 만들었어요. 파일 앱에 저장해 두세요.');
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('백업 파일을 내려받았어요.');
  }

  function importBackup(file) {
    const r = new FileReader();
    const bad = () => toast('백업 파일을 읽지 못했어요. 이 플래너에서 만든 백업 파일인지 확인해 주세요.');
    r.onerror = bad;
    r.onload = () => {
      let data = null;
      try { data = JSON.parse(String(r.result)); } catch (e) { data = null; }
      if (!data || typeof data !== 'object' || !['days', 'todos', 'events'].some(k => data[k] && typeof data[k] === 'object')) { bad(); return; }
      let n = 0;
      ['days', 'todos', 'events'].forEach(kind => {
        const src = data[kind];
        if (!src || typeof src !== 'object') return;
        Object.keys(src).forEach(id => {
          const v = src[id];
          if (!v || typeof v !== 'object' || (kind === 'days' && !isValidDate(id))) return;
          Store.save(kind, id, clone(v));
          n++;
        });
      });
      if (data.settings && typeof data.settings === 'object') Store.save('settings', 'settings', clone(data.settings));
      closeSheet();
      scheduleRender();
      toast('백업에서 기록 ' + n + '개를 불러왔어요.');
    };
    r.readAsText(file);
  }

  /* ---------------- offline app: lock ---------------- */
  const LOCK_KEY = (SKIN.storageKey || 'planner') + ':lock';
  const canLock = !!(SKIN.offline && window.isSecureContext && window.crypto && crypto.subtle);
  function readLock() {
    try { const v = JSON.parse(window.localStorage.getItem(LOCK_KEY) || 'null'); return v && v.salt && v.hash ? v : null; } catch (e) { return null; }
  }
  function writeLock(v) {
    try { if (v) window.localStorage.setItem(LOCK_KEY, JSON.stringify(v)); else window.localStorage.removeItem(LOCK_KEY); return true; } catch (e) { return false; }
  }
  async function pinHash(pin, salt) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  }
  const Lock = { el: null, entry: '', fails: 0, until: 0, hiddenAt: 0, busy: false, wipeArmed: false };

  function showLock() {
    if (!canLock || !readLock()) return;
    if (!$('#sheet').hidden) closeSheet();
    document.body.classList.add('locked');
    if (!Lock.el) {
      Lock.el = document.createElement('div');
      Lock.el.className = 'lock';
      Lock.el.setAttribute('role', 'dialog');
      Lock.el.setAttribute('aria-modal', 'true');
      Lock.el.setAttribute('aria-label', '잠금 해제');
      Lock.el.addEventListener('click', onLockClick);
      document.body.appendChild(Lock.el);
    }
    Lock.entry = '';
    Lock.wipeArmed = false;
    Lock.el.hidden = false;
    drawPad('비밀번호 4자리를 눌러 주세요', false);
  }
  function drawPad(msg, err) {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'forgot', '0', 'del'];
    Lock.el.innerHTML = '<div class="lock-inner">' +
      '<p class="lock-brand">' + esc(SKIN.lockTitle || 'Planner') + '</p>' +
      '<p class="lock-msg' + (err ? ' err' : '') + '" id="lockMsg" role="status">' + esc(msg) + '</p>' +
      '<div class="lock-dots" id="lockDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>' +
      '<div class="lock-pad">' + keys.map(k =>
        k === 'forgot' ? '<button type="button" class="lock-key ghost" data-lock="forgot">잊었어요</button>'
        : k === 'del' ? '<button type="button" class="lock-key ghost" data-lock="del" aria-label="한 자리 지우기">' + ICON.left + '</button>'
        : '<button type="button" class="lock-key" data-lock="' + k + '">' + k + '</button>').join('') + '</div>' +
    '</div>';
    updateDots();
  }
  function drawForgot() {
    Lock.el.innerHTML = '<div class="lock-inner">' +
      '<p class="lock-brand">' + esc(SKIN.lockTitle || 'Planner') + '</p>' +
      '<p class="lock-text">비밀번호는 이 기기에만 저장돼 있어서 찾을 수 없어요. 기록을 모두 지우고 새로 시작할 수 있어요. 백업 파일이 있다면 새로 시작한 뒤 설정에서 불러오면 돼요.</p>' +
      '<div class="lock-actions"><button type="button" class="btn" data-lock="back">돌아가기</button>' +
      '<button type="button" class="btn danger-solid" data-lock="wipe">' + (Lock.wipeArmed ? '한 번 더 누르면 모두 지워져요' : '모두 지우고 새로 시작') + '</button></div>' +
    '</div>';
  }
  function updateDots() {
    $$('#lockDots i', Lock.el).forEach((d, i) => d.classList.toggle('on', i < Lock.entry.length));
  }
  function setLockMsg(msg, err) {
    const m = $('#lockMsg', Lock.el);
    if (!m) return;
    m.textContent = msg;
    m.classList.toggle('err', !!err);
  }
  function lockPress(k) {
    if (Lock.busy) return;
    if (Date.now() < Lock.until) { setLockMsg(Math.ceil((Lock.until - Date.now()) / 1000) + '초 뒤에 다시 시도해 주세요.', true); return; }
    if (k === 'del') { Lock.entry = Lock.entry.slice(0, -1); updateDots(); return; }
    if (!/^\d$/.test(k) || Lock.entry.length >= 4) return;
    Lock.entry += k;
    updateDots();
    if (Lock.entry.length === 4) tryUnlock();
  }
  async function tryUnlock() {
    const lock = readLock();
    if (!lock) { unlockNow(); return; }
    Lock.busy = true;
    let ok = false;
    try { ok = (await pinHash(Lock.entry, lock.salt)) === lock.hash; } catch (e) { ok = false; }
    Lock.busy = false;
    if (ok) { Lock.fails = 0; unlockNow(); return; }
    Lock.fails++;
    Lock.entry = '';
    updateDots();
    if (Lock.fails >= 5) { Lock.fails = 0; Lock.until = Date.now() + 30000; setLockMsg('5번 틀렸어요. 30초 뒤에 다시 시도해 주세요.', true); }
    else setLockMsg('비밀번호가 맞지 않아요. 다시 눌러 주세요.', true);
    const dots = $('#lockDots', Lock.el);
    if (dots) { dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); }
  }
  function unlockNow() {
    if (Lock.el) Lock.el.hidden = true;
    document.body.classList.remove('locked');
    Lock.entry = '';
  }
  function onLockClick(e) {
    const b = e.target.closest('[data-lock]');
    if (!b) return;
    const k = b.dataset.lock;
    if (k === 'forgot') { Lock.wipeArmed = false; drawForgot(); return; }
    if (k === 'back') { drawPad('비밀번호 4자리를 눌러 주세요', false); return; }
    if (k === 'wipe') {
      if (!Lock.wipeArmed) { Lock.wipeArmed = true; drawForgot(); return; }
      if (Store.backend && Store.backend.disable) Store.backend.disable();
      try { window.localStorage.removeItem(SKIN.storageKey || 'daily-planner-v1'); } catch (x) { /* ignore */ }
      writeLock(null);
      location.reload();
      return;
    }
    lockPress(k);
  }

  function openPinSheet() {
    if (!canLock) return;
    S.sheet = { kind: 'pin' };
    const pinInput = (id, label) => '<div class="field"><label for="' + id + '">' + label + '</label><input class="input pin" id="' + id + '" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password"></div>';
    openSheet('비밀번호 잠금',
      '<form class="form" id="pinForm" novalidate>' +
        pinInput('pin1', '새 비밀번호 4자리') + pinInput('pin2', '한 번 더 눌러 주세요') +
        '<p class="hint">비밀번호를 잊으면 기록을 지워야 다시 열 수 있어요. 잊지 않을 번호로 정하고, 백업 파일도 만들어 두세요.</p>' +
        '<p class="form-error" id="pinErr" role="alert" hidden></p>' +
        '<div class="sheet-actions"><button type="button" class="btn ghost" data-action="close-sheet">취소</button><button type="submit" class="btn primary">잠금 켜기</button></div>' +
      '</form>',
      root => {
        $('#pinForm', root).addEventListener('submit', async ev => {
          ev.preventDefault();
          const a = $('#pin1', root).value, b = $('#pin2', root).value;
          const err = m => { const p = $('#pinErr', root); p.textContent = m; p.hidden = false; };
          if (!/^\d{4}$/.test(a)) { err('숫자 4자리로 정해 주세요.'); return; }
          if (a !== b) { err('두 번 누른 번호가 달라요. 다시 확인해 주세요.'); return; }
          const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)), x => x.toString(16).padStart(2, '0')).join('');
          const hash = await pinHash(a, salt);
          if (!writeLock({ salt: salt, hash: hash })) { err('이 기기에 저장하지 못했어요.'); return; }
          closeSheet();
          toast('잠금을 켰어요. 다음에 앱을 열 때부터 비밀번호를 물어봐요.');
        });
        setTimeout(() => { try { $('#pin1', root).focus(); } catch (x) { /* ignore */ } }, 80);
      });
  }

  function installHint() {
    if (!SKIN.offline) return;
    const standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (standalone || !ios) return;
    const bar = document.createElement('div');
    bar.className = 'install-bar';
    bar.innerHTML = '<span>앱처럼 쓰려면 Safari의 <b>공유</b> 버튼 → <b>홈 화면에 추가</b>를 눌러 주세요. 기록은 홈 화면 아이콘으로 연 앱에 저장돼요.</span>';
    const main = $('main');
    main.parentNode.insertBefore(bar, main);
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-view],[data-action],[data-mood],[data-cup],[data-filter],[data-due]');
    if (!t || t.disabled) return;
    if (t.dataset.view) { setView(t.dataset.view); return; }
    if (t.dataset.mood) { setMood(+t.dataset.mood); return; }
    if (t.dataset.cup) { setWater(+t.dataset.cup); return; }
    if (t.dataset.filter) { S.todoFilter = t.dataset.filter; renderTodo(); return; }
    if (t.dataset.due) { const g = t.closest('[data-due-group]'); if (g) pickDue(g.dataset.dueGroup, t.dataset.due); return; }
    switch (t.dataset.action) {
      case 'day-prev': goDate(addDays(S.date, -1)); break;
      case 'day-next': goDate(addDays(S.date, 1)); break;
      case 'day-today': goDate(today()); break;
      case 'go-date': goDate(t.dataset.date); break;
      case 'edit-todo': openTodoSheet(t.dataset.id); break;
      case 'edit-event': openEventSheet(t.dataset.id); break;
      case 'add-event': openEventSheet(null, t.dataset.date); break;
      case 'open-diary': if (isValidDate(t.dataset.date)) { S.date = t.dataset.date; updateWindows(); setView('today'); } break;
      case 'cal-prev': shiftMonth(-1); break;
      case 'cal-next': shiftMonth(1); break;
      case 'cal-today': S.calMonth = today().slice(0, 7); S.calSel = today(); updateWindows(); renderCal(); break;
      case 'cal-select': {
        const d = t.dataset.date;
        S.calSel = d;
        if (d.slice(0, 7) !== S.calMonth) { S.calMonth = d.slice(0, 7); updateWindows(); }
        renderCal();
        break;
      }
      case 'settings': openSettingsSheet(); break;
      case 'edit-routines': openRoutineSheet(); break;
      case 'close-sheet': closeSheet(); break;
      case 'over-to-today': overdueToToday(); break;
      case 'toggle-done': S.showDone = !S.showDone; renderTodo(); break;
      case 'clear-done': clearDone(); break;
      case 'example-clear': clearExamples(); break;
      case 'star-draft': S.todoDraft.star = !S.todoDraft.star; renderTodoForm(); break;
      case 'lock-set': openPinSheet(); break;
      case 'lock-off': writeLock(null); openSettingsSheet(); toast('잠금을 껐어요.'); break;
      case 'backup-export': exportBackup(); break;
    }
  });

  document.addEventListener('submit', e => {
    const f = e.target;
    if (f.id === 'dayTodoForm') {
      e.preventDefault();
      const inp = $('#dayTodoInput'), v = inp.value.trim();
      if (!v) return;
      addTodo(v, S.date, false);
      inp.value = '';
    } else if (f.id === 'todoForm') {
      e.preventDefault();
      const inp = $('#todoInput'), v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      const due = resolveDue(S.todoDraft.due);
      addTodo(v, due, S.todoDraft.star);
      inp.value = '';
      S.todoDraft.star = false;
      renderTodoForm();
      toast((due ? dueLabel(due) + ' 할 일에' : '언젠가 목록에') + ' 추가했어요.');
    }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (!el.matches || !el.matches('#view-today [data-bind]')) return;
    const day = dayForEdit();
    writeBind(day, el.dataset.bind, el.value);
    Store.save('days', S.date, day, 700);
    if (el.tagName === 'TEXTAREA') autoGrow(el);
    const row = el.closest('.hour-row');
    if (row) { const ev = row.querySelector('.h-events'); row.classList.toggle('filled', !!el.value.trim() || !!(ev && !ev.hidden)); }
    const ws = $('#weekStrip');
    if (ws) ws.innerHTML = weekStripHTML(S.date);
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (!el.dataset) return;
    if (el.dataset.todo) toggleTodo(el.dataset.todo, el.checked);
    else if (el.dataset.routine) toggleRoutine(el.dataset.routine, el.checked);
    else if (el.id === 'dayPicker') { if (isValidDate(el.value)) goDate(el.value); }
    else if (el.dataset.dueDate) { if (isValidDate(el.value)) pickDue(el.dataset.dueDate, el.value); }
  });

  document.addEventListener('keydown', e => {
    if (document.body.classList.contains('locked')) {
      if (/^\d$/.test(e.key)) { e.preventDefault(); lockPress(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); lockPress('del'); }
      return;
    }
    if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
    const el = e.target;
    const typing = el.closest && el.closest('input,textarea,select,[contenteditable]');
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !typing && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey && $('#sheet').hidden) {
      const n = e.key === 'ArrowLeft' ? -1 : 1;
      if (S.view === 'today') { e.preventDefault(); goDate(addDays(S.date, n)); }
      else if (S.view === 'cal') { e.preventDefault(); shiftMonth(n); }
      return;
    }
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && el.matches && el.matches('input[data-bind]')) {
      e.preventDefault();
      const all = $$('#view-today input[data-bind]');
      const i = all.indexOf(el);
      if (i >= 0 && all[i + 1]) all[i + 1].focus(); else el.blur();
    }
  });

  function tick() {
    const t = today();
    if (t !== S.todayStr) {
      if (S.date === S.todayStr) S.date = t;
      if (S.calSel === S.todayStr) S.calSel = t;
      S.todayStr = t;
      updateWindows();
      render();
      return;
    }
    if (S.view === 'today') markNow();
  }

  function start(hot) {
    hot = hot || {};
    if (isValidDate(hot.date)) S.date = hot.date;
    if (typeof hot.calMonth === 'string' && /^\d{4}-\d{2}$/.test(hot.calMonth)) S.calMonth = hot.calMonth;
    if (isValidDate(hot.calSel)) S.calSel = hot.calSel;
    let v = hot.view;
    if (!v) { const h = (location.hash || '').slice(1); v = h === 'todo' ? 'todo' : h === 'calendar' ? 'cal' : 'today'; }
    if (SKIN.offline) {
      showLock();
      installHint();
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* optional */ }
    }
    setView(v);
    initStore();
    setInterval(tick, 30000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { Store.flushAll(); Lock.hiddenAt = Date.now(); }
      else {
        if (Lock.hiddenAt && Date.now() - Lock.hiddenAt > 60000 && !document.body.classList.contains('locked')) showLock();
        tick();
      }
    });
    window.addEventListener('pagehide', () => Store.flushAll());
  }

  const hotApi = window.claude && window.claude.hot;
  try {
    if (hotApi && typeof hotApi.snapshot === 'function') hotApi.snapshot(() => ({ view: S.view, date: S.date, calMonth: S.calMonth, calSel: S.calSel }));
  } catch (e) { /* optional */ }
  if (hotApi && typeof hotApi.ready === 'function') hotApi.ready(start);
  else start((hotApi && hotApi.data) || {});
})();

</script>
<script>
(function () {
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')
      .then(function () { return navigator.serviceWorker.ready; })
      .then(function (reg) { if (reg.active) reg.active.postMessage('precache-fonts'); })
      .catch(function () {});
  });
})();
</script>
