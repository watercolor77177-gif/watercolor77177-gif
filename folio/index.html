<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Folio Daily Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../fonts/folio.css">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<style>
:root{
  /* Layout: a card-less folio page. Sections sit directly on porcelain paper, divided by hairlines;
     Bodoni numerals carry the hierarchy; champagne gold marks only "now" and finished things. */
  --paper:#F5F4F1;--card:#FFFFFF;--ink:#1D1B19;--ink-2:#6E6963;--ink-3:#A9A39C;
  --line:#DCD8D2;--line-soft:#E8E5E0;
  --accent:#1D1B19;--accent-soft:#EAE7E2;--accent-ink:#80663F;--on-accent:#F5F4F1;--focus:#80663F;
  --gold:#A88A58;--gold-soft:#EFE8DB;
  --c-project:#1D1B19;--c-project-soft:#E9E6E1;--c-appt:#A88A58;--c-appt-soft:#F1EBE0;--c-personal:#B07F7A;--c-personal-soft:#F3E9E7;
  --holiday:#9A4049;--sat:#55667F;--star:#A88A58;--strike:#A9A39C;
  --now-bg:transparent;--water:#A88A58;--cup-line:#A9A39C;--mood-bg:transparent;--check-line:#B5AFA7;
  --field-bg:#FFFFFF;--diary-bg:transparent;--rule:#E6E2DC;--note-bg:#ECE9E4;--seg-bg:transparent;
  --scrim:rgba(24,22,20,.42);--nav-bg:rgba(245,244,241,.94);--tabs-bg:transparent;
  --toast-bg:#1D1B19;--toast-fg:#F5F4F1;--toast-act:#D8C29B;
  --font-display:"Bodoni Moda","Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --font-serif-kr:"Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --radius:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141312;--card:#1C1B19;--ink:#ECE8E1;--ink-2:#A39D94;--ink-3:#6C675F;
  --line:#2E2B28;--line-soft:#242220;
  --accent:#ECE8E1;--accent-soft:#252320;--accent-ink:#CFB78D;--on-accent:#141312;--focus:#CFB78D;
  --gold:#C6AC7E;--gold-soft:#2E2920;
  --c-project:#ECE8E1;--c-project-soft:#282623;--c-appt:#C6AC7E;--c-appt-soft:#2D2820;--c-personal:#D2A39E;--c-personal-soft:#302626;
  --holiday:#DA8F8C;--sat:#9CAECB;--star:#C6AC7E;--strike:#6C675F;
  --water:#C6AC7E;--cup-line:#6C675F;--check-line:#5F5A53;
  --field-bg:#1A1917;--rule:#262421;--note-bg:#1F1D1B;
  --scrim:rgba(0,0,0,.6);--nav-bg:rgba(20,19,18,.94);
  --toast-bg:#ECE8E1;--toast-fg:#141312;--toast-act:#80663F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#141312;--card:#1C1B19;--ink:#ECE8E1;--ink-2:#A39D94;--ink-3:#6C675F;
  --line:#2E2B28;--line-soft:#242220;
  --accent:#ECE8E1;--accent-soft:#252320;--accent-ink:#CFB78D;--on-accent:#141312;--focus:#CFB78D;
  --gold:#C6AC7E;--gold-soft:#2E2920;
  --c-project:#ECE8E1;--c-project-soft:#282623;--c-appt:#C6AC7E;--c-appt-soft:#2D2820;--c-personal:#D2A39E;--c-personal-soft:#302626;
  --holiday:#DA8F8C;--sat:#9CAECB;--star:#C6AC7E;--strike:#6C675F;
  --water:#C6AC7E;--cup-line:#6C675F;--check-line:#5F5A53;
  --field-bg:#1A1917;--rule:#262421;--note-bg:#1F1D1B;
  --scrim:rgba(0,0,0,.6);--nav-bg:rgba(20,19,18,.94);
  --toast-bg:#ECE8E1;--toast-fg:#141312;--toast-act:#80663F;
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.4}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
svg{display:block}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:32px;height:32px;flex:none}
.brand-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand-name{font-family:var(--font-display);font-size:23px;line-height:1;white-space:nowrap}
.brand-sub{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.icon-btn{display:inline-grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent-ink)}
.icon-btn.sm{width:38px;height:38px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--nav-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line-soft)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:0;background:none;color:var(--ink-2);font-size:12px;border-radius:14px;white-space:nowrap}
.tab-ico{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background-color .2s}
.tab .ico{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab[aria-current="page"] .tab-ico{background:var(--accent-soft)}
.example-bar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;border-radius:16px;background:var(--note-bg);font-size:13.5px}
main{display:block}
.view{display:flex;flex-direction:column;gap:16px}

/* ---------- shared pieces ---------- */
.card{position:relative;min-width:0;background:var(--card);border-radius:var(--radius);padding:18px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-family:var(--font-display);font-weight:400;font-size:18px;line-height:1.3}
.sec-tools{display:flex;align-items:center;gap:8px;flex:none}
.count{font-family:var(--font-body);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:4px 11px;font-family:var(--font-body);font-size:12.5px;line-height:1.45;white-space:nowrap}
.mini:hover{color:var(--accent-ink);border-color:var(--accent)}
.empty{color:var(--ink-2);font-size:14px;padding:6px 0}
.sub-title{display:flex;align-items:baseline;gap:8px;font-weight:400;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.sub-val{color:var(--accent-ink);font-variant-numeric:tabular-nums}
.line-input{flex:1;min-width:0;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:9px 2px;outline:none;color:var(--ink)}
.line-input:focus{border-bottom-color:var(--focus,var(--accent))}
::placeholder{color:var(--ink-3);opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;white-space:nowrap}
.btn .ico{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--holiday);border-color:transparent}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-date{position:relative;overflow:hidden}
.chip-date .ico{width:16px;height:16px}
.chip-date input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
.chip-date input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}
.chip-date:has(input:focus-visible){outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.type-project{--c:var(--c-project);--c-soft:var(--c-project-soft)}
.type-appt{--c:var(--c-appt);--c-soft:var(--c-appt-soft)}
.type-personal{--c:var(--c-personal);--c-soft:var(--c-personal-soft)}

.check{position:relative;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.check input{position:absolute;left:0;top:50%;width:22px;height:22px;margin:-11px 0 0;opacity:0;cursor:pointer}
.check .box{flex:none;display:grid;place-items:center;width:21px;height:21px;border:1.5px solid var(--check-line);border-radius:7px;background:var(--card);transition:background-color .15s,border-color .15s}
.check input:checked + .box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .box::after{content:"";width:10px;height:5.5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg)}
.check input:focus-visible + .box{outline:2px solid var(--focus,var(--accent));outline-offset:2px}

.todo-list{display:flex;flex-direction:column}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.todo:last-child{border-bottom:0}
.todo .check{padding-top:1px}
.todo-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0;text-align:left;color:inherit}
.t-title{overflow-wrap:anywhere;line-height:1.45}
.todo.done .t-title{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--strike);text-decoration-thickness:1.5px}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-2)}
.t-star{display:inline-flex;align-items:center;gap:3px;color:var(--star)}
.t-star .ico{width:12px;height:12px;fill:currentColor;stroke:none}
.t-due.late{color:var(--holiday)}
.add-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.add-btn{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent)}
.over-hint{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;margin-bottom:6px;padding:8px 10px;border-radius:12px;background:var(--note-bg);font-size:13px;color:var(--ink-2)}

.ev-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0;padding:3px 11px 3px 9px;border:0;border-radius:999px;background:var(--c-soft);color:var(--ink);font-size:13px;line-height:1.5;text-align:left}
.ev-chip::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.ev-time{flex:none;color:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums}
.ev-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- diary page ---------- */
.day-head{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"prev main next" "tools tools tools";align-items:center;gap:6px 8px}
.dh-prev{grid-area:prev}.dh-next{grid-area:next}
.nav-arrow{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink-2)}
.nav-arrow:hover{background:var(--accent-soft);color:var(--accent-ink)}
.dh-main{grid-area:main;display:flex;align-items:center;justify-content:center;gap:14px;min-width:0;font-weight:400}
.dh-num{font-family:var(--font-display);font-size:64px;line-height:.92}
.dh-meta{display:flex;flex-direction:column;gap:5px;min-width:0}
.dh-month{font-family:var(--font-display);font-size:22px;line-height:1.1}
.dh-week{font-size:14px;color:var(--ink-2)}
.dh-hol{color:var(--holiday);font-weight:inherit}
.dh-tools{grid-area:tools;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.dh-rel{font-size:13px;color:var(--accent-ink)}
.head-decor{position:absolute;pointer-events:none}

.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.ws-day{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:6px 0;border:0;border-radius:16px;background:none;color:var(--ink)}
.ws-wd{font-size:11.5px;color:var(--ink-2)}
.ws-num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums}
.ws-day.sun .ws-wd,.ws-day.hol .ws-wd,.ws-day.hol .ws-num{color:var(--holiday)}
.ws-day.sat .ws-wd{color:var(--sat)}
.ws-day.today .ws-num{box-shadow:inset 0 0 0 1.5px var(--accent)}
.ws-day.sel .ws-num{background:var(--accent);color:var(--on-accent);box-shadow:none}
.ws-marks{display:flex;gap:3px;height:5px}
.ws-marks i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.ws-marks i.rec{background:var(--ink-3)}

.day-grid{display:grid;gap:16px}
.day-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.goals{display:flex;flex-direction:column;gap:2px}
.goal{display:flex;align-items:center;gap:12px}
.goal-n{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-variant-numeric:tabular-nums}

.allday{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.hours{--hcol:52px;--ncol:22px}
.period{margin:12px 0 2px;font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.period:first-child{margin-top:0}
.hour-row{display:grid;grid-template-columns:var(--hcol) minmax(0,1fr);align-items:start;min-height:46px}
.node{display:none}
.h-label{padding-top:12px;line-height:1.2;color:var(--ink-2);font-variant-numeric:tabular-nums}
.h-label b{font-weight:400;font-size:16px;color:var(--ink)}
.h-label small{font-size:11px}
.hour-row.now .h-label::after{content:"지금";display:block;width:fit-content;margin-top:4px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10.5px;line-height:1.7}
.h-body{display:flex;flex-direction:column;min-width:0}
.h-events{display:flex;flex-wrap:wrap;gap:4px;padding-top:8px}
.h-body input{width:100%;min-width:0;min-height:45px;padding:11px 2px;border:0;border-radius:0;background:transparent;outline:none;color:var(--ink)}

.routine-list{display:flex;flex-direction:column}
.routine{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.routine:last-child{border-bottom:0}
.r-name{overflow-wrap:anywhere}
.routine.on .r-name{color:var(--ink-2)}
.r-hist{display:flex;gap:4px;flex:none}
.r-hist i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.r-hist i.on{background:var(--accent)}
.r-hist i.cur{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}

.cond{display:flex;flex-wrap:wrap;gap:16px 32px}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.mood{display:grid;place-items:center;width:42px;height:42px;padding:0;border:0;border-radius:50%;background:var(--mood-bg);color:var(--ink-2);transition:transform .15s,background-color .15s}
.mood svg{width:30px;height:30px}
.mood .face{fill:none;stroke:currentColor;stroke-width:1.3}
.mood .eye{fill:currentColor;stroke:none}
.mood path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.mood .cheek{fill:var(--accent);opacity:0;stroke:none}
.mood[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.mood[aria-pressed="true"] .cheek{opacity:.5}
.cups{display:flex;flex-wrap:wrap;gap:2px}
.cup{width:30px;height:38px;padding:3px;border:0;background:none;color:var(--cup-line)}
.cup svg{width:100%;height:100%}
.cup .glass{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.cup .water{fill:transparent;transition:fill .2s}
.cup.full .water{fill:var(--water)}

.grateful{display:flex;flex-direction:column;margin-bottom:18px}
.gr-row{display:flex;align-items:center;gap:10px}
.gr-mark{flex:none;width:8px;height:8px;background:var(--accent);opacity:.7}
.diary{display:block;width:100%;min-height:152px;padding:0 4px;border:0;border-radius:0;outline:none;resize:none;color:var(--ink);font-size:16px;line-height:1.95em;background-color:var(--diary-bg);background-image:linear-gradient(to bottom,transparent calc(1.95em - 1px),var(--rule) calc(1.95em - 1px),var(--rule) 1.95em);background-size:100% 1.95em;background-attachment:local}

/* ---------- to-do page ---------- */
#view-todo{width:100%;max-width:760px;margin:0 auto}
.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:4px 2px 0}
.view-title{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.15}
.view-sub{font-size:14px;color:var(--ink-2)}
.todo-add{display:flex;flex-direction:column;gap:12px}
.todo-add .add-row{margin-top:0}
.star-toggle{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-3)}
.star-toggle[aria-pressed="true"]{color:var(--star);border-color:var(--star)}
.star-toggle[aria-pressed="true"] .ico{fill:currentColor}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--seg-bg);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:8px 14px;border:0;border-radius:999px;background:none;color:var(--ink-2);font-size:14px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--card);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.todo-groups{display:flex;flex-direction:column;gap:14px}
.done-toggle{align-self:center;padding:8px 12px;border:0;background:none;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ---------- calendar page ---------- */
.cal-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:4px}
.cal-title{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:400}
.cal-m{font-family:var(--font-display);font-size:44px;line-height:1;font-variant-numeric:lining-nums}
.cal-meta{display:flex;flex-direction:column;line-height:1.25}
.cal-en{font-family:var(--font-display);font-size:18px}
.cal-y{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal-layout{display:grid;gap:16px}
.cal-card{padding:14px 8px 12px}
.cal-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-bottom:6px;text-align:center;font-size:12px;color:var(--ink-2)}
.cal-wd .sun{color:var(--holiday)}.cal-wd .sat{color:var(--sat)}
.cal-week{position:relative;border-top:1px solid var(--line-soft);--bar-top:28px;--lane-h:15px}
.cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-day{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:68px;padding:calc(var(--bar-top) + var(--lanes,0) * var(--lane-h)) 2px 6px;border:0;border-radius:12px;background:none;color:var(--ink);text-align:center}
.cd-num{position:absolute;top:3px;left:50%;transform:translateX(-50%);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;font-variant-numeric:tabular-nums}
.cal-day.sun .cd-num,.cal-day.hol .cd-num{color:var(--holiday)}
.cal-day.sat .cd-num{color:var(--sat)}
.cal-day.today .cd-num{background:var(--accent);color:var(--on-accent)}
.cal-day.sel{background:var(--accent-soft)}
.cal-day.out{opacity:.38}
.cd-rec{position:absolute;top:5px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cd-hol{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;line-height:1.25;letter-spacing:-.02em;color:var(--holiday)}
.cd-marks{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
.cd-ev{display:inline-flex;align-items:center;min-width:0;max-width:100%}
.cd-dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--c)}
.cd-t{display:none}
.cd-more{font-size:10px;line-height:1.3;color:var(--ink-2)}
.cal-bars{position:absolute;inset:0;pointer-events:none}
.cal-bar{--gl:2px;--gr:2px;position:absolute;left:calc(var(--s) * 100% / 7 + var(--gl));width:calc(var(--n) * 100% / 7 - var(--gl) - var(--gr));top:calc(var(--bar-top) + var(--lane) * var(--lane-h) - 2px);height:calc(var(--lane-h) - 3px);padding:0 5px;border-radius:5px;background:var(--c-soft);color:var(--ink);font-size:10px;line-height:calc(var(--lane-h) - 3px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.cal-bar.cont-l{--gl:0px;border-top-left-radius:0;border-bottom-left-radius:0}
.cal-bar.cont-r{--gr:0px;border-top-right-radius:0;border-bottom-right-radius:0}
.cal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lg-hol i{background:var(--holiday)}
.lg-rec i{width:5px;height:5px;background:var(--accent)}
.cal-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.agenda-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.agenda-head .sec-title{margin-bottom:0}
.hol-badge{flex:none;padding:1px 9px;border:1px solid currentColor;border-radius:999px;font-size:12px;color:var(--holiday);white-space:nowrap}
.agenda-list,.up-list{display:flex;flex-direction:column;gap:8px}
.agenda-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:14px;background:var(--c-soft);color:var(--ink);text-align:left}
.ai-time{flex:none;min-width:62px;font-size:12.5px;line-height:1.35;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ai-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ai-title{overflow-wrap:anywhere}
.ai-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--ink-2)}
.ai-type{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.ai-type::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.agenda-sub{margin-top:16px}
.agenda-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.up-item{display:flex;align-items:center;gap:12px;width:100%;padding:8px 2px;border:0;border-bottom:1px solid var(--line-soft);background:none;color:var(--ink);text-align:left}
.up-list li:last-child .up-item{border-bottom:0}
.up-date{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:46px;border-radius:14px;background:var(--c-soft);line-height:1.05}
.up-date b{font-family:var(--font-display);font-weight:400;font-size:18px}
.up-date small{font-size:11px;color:var(--ink-2)}
.up-main{flex:1;min-width:0;display:flex;flex-direction:column}
.up-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-sub{font-size:12.5px;color:var(--ink-2)}
.up-dday{flex:none;font-size:12px;color:var(--accent-ink);font-variant-numeric:tabular-nums}

/* ---------- sheet & forms ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;padding:8px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-radius:26px 26px 0 0;background:var(--card);box-shadow:0 -14px 40px -22px rgba(0,0,0,.4)}
.sheet::before{content:"";display:block;width:40px;height:4px;margin:4px auto 10px;border-radius:4px;background:var(--line)}
.sheet-inner{display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-title{font-family:var(--font-display);font-weight:400;font-size:22px}
.sheet-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:6px}
.sheet-actions .danger{margin-right:auto}
body.sheet-open{overflow:hidden}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.label{font-size:13px;color:var(--ink-2)}
.field small{margin-left:6px;font-size:12px;color:var(--ink-3)}
.input{width:100%;min-width:0;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--field-bg);color:var(--ink);outline:none}
.input:focus{border-color:var(--focus,var(--accent));box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;line-height:1.6}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-error{font-size:14px;color:var(--holiday)}
.hint{font-size:14px;color:var(--ink-2)}
.note{padding:12px 14px;border-radius:14px;background:var(--note-bg);font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.chip.type-chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.type-chip[aria-checked="true"]{background:var(--c-soft);border-color:var(--c);color:var(--ink)}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;width:fit-content;cursor:pointer;font-size:15px}
.switch input{position:absolute;left:0;top:50%;width:46px;height:28px;margin:-14px 0 0;opacity:0;cursor:pointer}
.switch .sw{position:relative;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background-color .2s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked + .sw{background:var(--accent)}
.switch input:checked + .sw::after{transform:translateX(18px)}
.switch input:focus-visible + .sw{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.switch-row{display:flex;flex-wrap:wrap;gap:12px 24px}
.rt-list{display:flex;flex-direction:column;gap:8px}
.rt-item{display:flex;align-items:center;gap:4px}
.rt-list + .add-row{margin-top:0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;transform:translateX(-50%);display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);padding:11px 16px;border-radius:16px;background:var(--toast-bg);color:var(--toast-fg);font-size:14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.45)}
.toast button{flex:none;padding:0;border:0;background:none;color:var(--toast-act);font-weight:700}

/* ---------- wide screens ---------- */
@media (min-width:760px){
  .day-grid{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);align-items:start}
  .cal-week{--bar-top:31px;--lane-h:18px}
  .cal-day{align-items:stretch;min-height:98px;padding-left:4px;padding-right:4px}
  .cd-num{left:6px;transform:none}
  .cd-hol{position:absolute;top:7px;left:34px;right:14px;text-align:left;font-size:11px}
  .cd-rec{top:12px;right:7px}
  .cd-marks{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:2px}
  .cd-ev{gap:5px;padding:1px 6px;border-radius:5px;background:var(--c-soft);font-size:11px;line-height:1.4}
  .cd-dot{width:5px;height:5px}
  .cd-t{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .cd-more{text-align:left;padding-left:4px}
  .cal-bar{font-size:11px}
}
@media (min-width:700px){
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{border-radius:26px;padding-bottom:22px}
  .sheet::before{display:none}
}
@media (min-width:900px){
  .app{padding-bottom:48px}
  .tabs{position:static;flex:none;gap:4px;padding:4px;border:1px solid var(--line-soft);border-radius:999px;background:var(--tabs-bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  .tab{flex-direction:row;gap:6px;padding:6px 16px 6px 8px;font-size:14px;border-radius:999px}
  .tab-ico{width:26px;height:26px;background:none!important}
  .tab .ico{width:19px;height:19px}
  .tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
  .toast{bottom:28px}
}
@media (min-width:1000px){
  .cal-layout{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}
}
@media (prefers-reduced-motion:no-preference){
  @keyframes sheet-up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
  @keyframes pop{50%{transform:scale(1.16)}}
  .sheet{animation:sheet-up .24s ease-out}
  .check input:checked + .box{animation:pop .26s ease-out}
  .mood:active,.cup:active{transform:scale(.92)}
}

/* ---------- offline app: lock screen, backup, install hint ---------- */
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.file-btn{position:relative;overflow:hidden;cursor:pointer}
.btn.danger-solid{background:var(--holiday);border-color:var(--holiday);color:#FFFFFF}
.install-bar{margin-bottom:14px;padding:10px 14px;border-radius:14px;background:var(--note-bg);font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.install-bar b{color:var(--ink);font-weight:600}
body.locked .app{visibility:hidden}
.lock{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;overflow-y:auto;background:var(--paper);padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lock-inner{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:340px;text-align:center}
.lock-brand{font-family:var(--font-display);font-size:26px;line-height:1.2;color:var(--ink)}
.lock-msg{min-height:1.6em;font-size:14px;color:var(--ink-2)}
.lock-msg.err{color:var(--holiday)}
.lock-text{font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.lock-actions{display:flex;flex-direction:column;gap:10px;width:100%}
.lock-dots{display:flex;gap:16px;margin-bottom:6px}
.lock-dots i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.lock-dots i.on{background:var(--ink);box-shadow:none}
.lock-pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px 24px}
.lock-key{display:grid;place-items:center;width:72px;height:72px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--font-display);font-size:28px;font-variant-numeric:lining-nums}
.lock-key:active{background:var(--accent-soft)}
.lock-key.ghost{border-color:transparent;background:none;font-family:var(--font-body);font-size:14px;color:var(--ink-2)}
.lock-key.ghost .ico{width:24px;height:24px}
@media (prefers-reduced-motion:no-preference){
  @keyframes lock-shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .lock-dots.shake{animation:lock-shake .4s}
}

.ico{stroke-width:1.3}
.brand-text{gap:4px}
.brand-name{font-size:21px;font-weight:500;letter-spacing:.36em;text-transform:uppercase}
.brand-sub{font-size:9px;letter-spacing:.32em;color:var(--ink-3)}
.icon-btn,.nav-arrow{border-radius:0}
.icon-btn:hover,.nav-arrow:hover{background:none;color:var(--ink)}
.view{gap:26px}
.example-bar{border-radius:0;background:none;border:1px solid var(--line);font-size:13px;color:var(--ink-2)}

/* sections: no cards, just a hairline and room to breathe */
.card{background:none;border-radius:0;padding:22px 0 0;border-top:1px solid var(--line)}
.sec-title{align-items:flex-end;margin-bottom:16px;font-size:17px;letter-spacing:-.01em}
.sec-title>span:first-child{display:flex;flex-direction:column;gap:6px}
.sec-title>span:first-child::before{content:var(--eyebrow,none);font-family:var(--font-display);font-size:10px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.sec-goals{--eyebrow:"Focus"}.sec-hours{--eyebrow:"Schedule"}.sec-todos{--eyebrow:"Tasks"}.sec-routine{--eyebrow:"Rituals"}
.sec-cond{--eyebrow:"Condition"}.sec-diary{--eyebrow:"Journal"}.agenda{--eyebrow:"Agenda"}.upcoming{--eyebrow:"Upcoming"}
.count{font-size:12px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.mini{border-radius:0;background:none;font-size:12px;letter-spacing:.04em;padding:4px 10px}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.btn{border-radius:0;font-size:14px;letter-spacing:.06em}
.chip{border-radius:0;font-size:13.5px}
.add-btn{border-radius:0;width:36px;height:36px}
.star-toggle{border-radius:0}
.line-input{border-bottom-color:var(--line-soft)}
.empty{font-size:13.5px;color:var(--ink-3)}
.over-hint{border-radius:0;background:none;border:1px solid var(--line);font-size:12.5px}
.ev-chip{gap:8px;padding:3px 10px 3px 10px;border-radius:0;background:var(--c-soft);box-shadow:inset 2px 0 0 var(--c);font-size:13px}
.ev-chip::before{display:none}
.check .box{width:18px;height:18px;border-width:1px;border-radius:50%;background:none}
.check input:checked + .box::after{width:8px;height:4.5px;border-left-width:1.5px;border-bottom-width:1.5px}
.todo{padding:11px 0}
.todo.done .t-title{color:var(--ink-3)}
.t-meta{font-size:11.5px;letter-spacing:.02em}

/* the date: a large Bodoni numeral with an almanac line beneath */
.day-head{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"main prev next" "alm alm alm" "tools tools tools";align-items:end;gap:12px 2px;padding:4px 0 18px;border-bottom:1px solid var(--line)}
.day-head .ribbon{display:none}
.dh-prev,.dh-next{align-self:start}
.dh-main{justify-content:flex-start;align-items:flex-end;gap:18px}
.dh-num{font-size:104px;line-height:.8;letter-spacing:-.03em;font-variant-numeric:lining-nums}
.dh-meta{gap:9px;padding-bottom:3px}
.dh-month{font-size:28px;font-style:italic;line-height:1}
.dh-week{font-size:12.5px;letter-spacing:.16em;color:var(--ink-2)}
.dh-alm{grid-area:alm;display:flex;flex-wrap:wrap;gap:4px 0;font-size:11.5px;letter-spacing:.1em;color:var(--ink-2);font-variant-numeric:lining-nums tabular-nums}
.dh-alm i{padding:0 10px;font-style:normal;color:var(--ink-3)}
.dh-alm b{font-weight:500;color:var(--accent-ink)}
.dh-tools{justify-content:flex-start;gap:10px}
.dh-tools .chip{background:none}
.dh-rel{font-size:11.5px;letter-spacing:.2em;color:var(--accent-ink)}
.week-strip{gap:0}
.ws-day{border-radius:0;gap:5px}
.ws-wd{font-size:10.5px;letter-spacing:.14em}
.ws-num{font-family:var(--font-display);font-size:17px;font-variant-numeric:lining-nums}
.ws-day.today .ws-num{box-shadow:inset 0 0 0 1px var(--gold)}
.ws-marks i{width:4px;height:4px}
.ws-marks i.rec{background:var(--gold)}
.day-grid,.day-col{gap:30px}

/* focus list with roman numerals */
.goals{counter-reset:goal;gap:0}
.goal{counter-increment:goal;gap:14px}
.goal-n{width:26px;height:auto;justify-content:start;border-radius:0;background:none;font-size:0;color:var(--ink-2)}
.goal-n::before{content:counter(goal,lower-roman) ".";font-family:var(--font-display);font-size:17px;font-style:italic}

/* hours: hairlines; hour numerals darken once something is planned, gold marks the present hour */
.hours{--hcol:54px}
.period{margin:20px 0 6px;font-size:10.5px;letter-spacing:.32em;color:var(--ink-3)}
.period:first-child{margin-top:2px}
.hour-row{min-height:48px;border-top:1px solid var(--line-soft)}
.h-label{padding-top:13px}
.h-label b{font-family:var(--font-display);font-size:18px;color:var(--ink-3);font-variant-numeric:lining-nums tabular-nums;transition:color .2s}
.h-label small{display:none}
.hour-row.filled .h-label b{color:var(--ink)}
.hour-row.now{border-top-color:var(--gold)}
.hour-row.now .h-label b{color:var(--accent-ink)}
.hour-row.now .h-label::after{margin-top:3px;padding:0;background:none;color:var(--accent-ink);font-size:10px;letter-spacing:.2em}
.h-body input{min-height:47px}

/* rituals, condition, journal */
.routine{padding:10px 0}
.r-hist{gap:5px}
.r-hist i{width:5px;height:5px;background:none;box-shadow:inset 0 0 0 1px var(--line)}
.r-hist i.on{background:var(--gold);box-shadow:none}
.r-hist i.cur{box-shadow:inset 0 0 0 1px var(--ink-3)}
.r-hist i.cur.on{box-shadow:none}
.cond{gap:18px 48px}
.sub-title{font-size:12.5px;letter-spacing:.06em}
.sub-val{color:var(--accent-ink)}
.moods{gap:4px;align-items:center}
.mood.mood-dot{width:32px;height:34px;border-radius:0;background:none}
.mood-dot .md{display:block;width:var(--d);height:var(--d);border-radius:50%;box-shadow:inset 0 0 0 1px var(--ink-3);transition:background-color .2s}
.mood-dot:nth-child(1){--d:7px}.mood-dot:nth-child(2){--d:9px}.mood-dot:nth-child(3){--d:11px}.mood-dot:nth-child(4){--d:13px}.mood-dot:nth-child(5){--d:15px}
.mood-dot[aria-pressed="true"]{background:none}
.mood-dot[aria-pressed="true"] .md{background:var(--ink);box-shadow:none}
.cups{gap:0;align-items:flex-end}
.cup.cup-bar{display:flex;justify-content:center;align-items:flex-end;width:22px;height:34px;padding:0 0 5px}
.cup-bar .wb{display:block;width:5px;height:24px;box-shadow:inset 0 0 0 1px var(--ink-3);transition:background-color .2s}
.cup-bar.full .wb{background:var(--gold);box-shadow:none}
.gr-mark{width:12px;height:1px;background:var(--gold);opacity:1}
.diary{font-family:var(--font-serif-kr);font-size:16px}

/* to-do page */
.view-title{font-size:34px}
.view-sub{font-size:12.5px;letter-spacing:.04em}
.seg{gap:24px;padding:0;border-radius:0;border-bottom:1px solid var(--line);background:none}
.seg button{flex:0 0 auto;padding:10px 0;border-radius:0;font-size:13.5px;letter-spacing:.04em}
.seg button[aria-selected="true"]{background:none;box-shadow:inset 0 -1.5px 0 var(--ink);color:var(--ink)}
.done-toggle{font-size:12.5px;letter-spacing:.06em;color:var(--ink-2)}

/* calendar */
.cal-head{padding-bottom:16px;border-bottom:1px solid var(--line)}
.cal-m{font-size:64px;line-height:.85;font-weight:400}
.cal-en{font-size:22px;font-style:italic}
.cal-y{font-size:11px;letter-spacing:.24em}
.cal-card{padding:0;border-top:0}
.cal-wd{padding:12px 0 8px;font-size:10.5px;letter-spacing:.16em}

.lg-rec i{background:var(--gold)}
.ag-lunar{margin-top:4px;font-family:var(--font-body);font-size:11.5px;letter-spacing:.1em;color:var(--ink-2)}
.hol-badge{border-radius:0;font-size:11.5px}
.agenda-list,.up-list{gap:0}
.agenda-item{padding:12px 0 12px 14px;border-radius:0;background:none;box-shadow:inset 2px 0 0 var(--c);border-bottom:1px solid var(--line-soft)}
.up-date{border-radius:0;background:none;box-shadow:inset 0 0 0 1px var(--line)}
.up-date b{font-size:20px;font-variant-numeric:lining-nums}
.up-dday{color:var(--accent-ink);letter-spacing:.06em}

/* lock screen */
.lock-brand{font-size:22px;font-weight:500;letter-spacing:.36em;text-transform:uppercase}
.lock-key{background:none}
.lock-dots i{width:11px;height:11px}
.install-bar{border-radius:0;background:none;border:1px solid var(--line)}

/* sheets, toast, tabs */
.sheet{border-radius:0}
.sheet::before{width:32px;height:2px;border-radius:0}
.input{border-radius:0}
.note{border-radius:0}
.toast{border-radius:0;letter-spacing:.02em}
.tabs{border-top:1px solid var(--line)}
.tab{font-size:11px;letter-spacing:.1em}
.tab-ico{width:40px;height:28px;border-radius:0}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .tab-ico{background:none}
.tab[aria-current="page"]>span:last-child{box-shadow:inset 0 -1px 0 var(--ink)}
@media (min-width:700px){.sheet{border-radius:2px}}
@media (min-width:760px){
  .dh-num{font-size:128px}
  .dh-month{font-size:32px}
  .day-grid{gap:56px}
  .cd-ev{border-radius:0;box-shadow:inset 2px 0 0 var(--c)}
  .cd-dot{display:none}
}
@media (min-width:900px){
  .tabs{gap:32px;padding:0;border:0;background:none}
  .tab{padding:8px 0;border-radius:0;font-size:12.5px;letter-spacing:.16em}
  .tab-ico{display:none}
  .tab[aria-current="page"]{background:none;color:var(--ink)}
}

<script>window.__SKIN__ = {"id": "folio", "storageKey": "folio-planner-v1", "cheeks": false, "routineIcon": "none", "lowerMonth": false, "headDecor": "", "almanac": true, "moodStyle": "dots", "waterStyle": "bars", "offline": true, "lockTitle": "Folio", "backupName": "folio"};</script>
<script>
(function () {
  'use strict';
  var SKIN = window.__SKIN__ || {};
  document.documentElement.lang = 'ko';

  /* ---------------- helpers ---------------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const str = v => (typeof v === 'string' ? v : '');

  /* ---------------- dates ---------------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const today = () => ymd(new Date());
  const weekStartOf = s => addDays(s, -parse(s).getDay());
  const isValidDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const monthName = i => (SKIN.lowerMonth ? MON[i].toLowerCase() : MON[i]);
  const fmtLong = s => { const d = parse(s); return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };
  const fmtMD = s => { const d = parse(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WD[d.getDay()] + '요일'; };
  const fmtShort = s => { const d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + WD[d.getDay()] + ')'; };
  const relLabel = s => {
    const n = diffDays(today(), s);
    if (n === 0) return '오늘';
    if (n === 1) return '내일';
    if (n === -1) return '어제';
    return n > 0 ? n + '일 뒤' : (-n) + '일 전';
  };

  /* Korean public holidays (incl. substitute holidays) */
  const HOLIDAYS = {
    '2026-01-01': '신정', '2026-02-16': '설날 연휴', '2026-02-17': '설날', '2026-02-18': '설날 연휴',
    '2026-03-01': '삼일절', '2026-03-02': '대체공휴일', '2026-05-01': '노동절', '2026-05-05': '어린이날',
    '2026-05-24': '부처님오신날', '2026-05-25': '대체공휴일', '2026-06-03': '지방선거', '2026-06-06': '현충일',
    '2026-07-17': '제헌절', '2026-08-15': '광복절', '2026-08-17': '대체공휴일', '2026-09-24': '추석 연휴',
    '2026-09-25': '추석', '2026-09-26': '추석 연휴', '2026-10-03': '개천절', '2026-10-05': '대체공휴일',
    '2026-10-09': '한글날', '2026-12-25': '성탄절',
    '2027-01-01': '신정', '2027-02-06': '설날 연휴', '2027-02-07': '설날', '2027-02-08': '설날 연휴',
    '2027-02-09': '대체공휴일', '2027-03-01': '삼일절', '2027-05-01': '노동절', '2027-05-03': '대체공휴일',
    '2027-05-05': '어린이날', '2027-05-13': '부처님오신날', '2027-06-06': '현충일', '2027-07-17': '제헌절',
    '2027-07-19': '대체공휴일', '2027-08-15': '광복절', '2027-08-16': '대체공휴일', '2027-09-14': '추석 연휴',
    '2027-09-15': '추석', '2027-09-16': '추석 연휴', '2027-10-03': '개천절', '2027-10-04': '대체공휴일',
    '2027-10-09': '한글날', '2027-10-11': '대체공휴일', '2027-12-25': '성탄절', '2027-12-27': '대체공휴일'
  };

  /* 24 solar terms in Korea time, 2026–2027 */
  const TERMS = {
    '2026-01-05': '소한', '2026-01-20': '대한', '2026-02-04': '입춘', '2026-02-19': '우수', '2026-03-05': '경칩', '2026-03-20': '춘분',
    '2026-04-05': '청명', '2026-04-20': '곡우', '2026-05-05': '입하', '2026-05-21': '소만', '2026-06-06': '망종', '2026-06-21': '하지',
    '2026-07-07': '소서', '2026-07-23': '대서', '2026-08-07': '입추', '2026-08-23': '처서', '2026-09-07': '백로', '2026-09-23': '추분',
    '2026-10-08': '한로', '2026-10-23': '상강', '2026-11-07': '입동', '2026-11-22': '소설', '2026-12-07': '대설', '2026-12-22': '동지',
    '2027-01-05': '소한', '2027-01-20': '대한', '2027-02-04': '입춘', '2027-02-19': '우수', '2027-03-06': '경칩', '2027-03-21': '춘분',
    '2027-04-05': '청명', '2027-04-20': '곡우', '2027-05-06': '입하', '2027-05-21': '소만', '2027-06-06': '망종', '2027-06-21': '하지',
    '2027-07-07': '소서', '2027-07-23': '대서', '2027-08-08': '입추', '2027-08-23': '처서', '2027-09-08': '백로', '2027-09-23': '추분',
    '2027-10-08': '한로', '2027-10-24': '상강', '2027-11-08': '입동', '2027-11-22': '소설', '2027-12-07': '대설', '2027-12-22': '동지'
  };
  const TERM_DATES = Object.keys(TERMS).sort();
  /* Korean lunar calendar (dangi); omitted where the browser lacks it rather than shown a day off */
  const LUNAR = (() => {
    try {
      const f = new Intl.DateTimeFormat('ko-KR-u-ca-dangi', { month: 'numeric', day: 'numeric' });
      return f.resolvedOptions().calendar === 'dangi' ? f : null;
    } catch (e) { return null; }
  })();
  function lunarLabel(s) {
    if (!LUNAR) return '';
    try {
      const d = parse(s);
      const parts = LUNAR.formatToParts(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12));
      const m = parts.find(p => p.type === 'month'), dd = parts.find(p => p.type === 'day');
      return m && dd ? '음력 ' + m.value + '.' + dd.value : '';
    } catch (e) { return ''; }
  }
  function isoWeek(s) {
    const d = parse(s), wd = (d.getDay() + 6) % 7;
    const th = new Date(d.getFullYear(), d.getMonth(), d.getDate() - wd + 3);
    const jan4 = new Date(th.getFullYear(), 0, 4);
    return 1 + Math.round((Math.round((th - jan4) / 864e5) - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  }
  function almanacHTML(s) {
    const bits = [];
    const lunar = lunarLabel(s);
    if (lunar) bits.push(esc(lunar));
    if (TERMS[s]) bits.push('<b>' + TERMS[s] + '</b>');
    else {
      const next = TERM_DATES.find(x => x > s);
      if (next && diffDays(s, next) <= 16) bits.push(TERMS[next] + ' D-' + diffDays(s, next));
    }
    const y = +s.slice(0, 4), leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
    bits.push('W' + isoWeek(s));
    bits.push((diffDays(y + '-01-01', s) + 1) + '/' + (leap ? 366 : 365));
    return bits.join('<i aria-hidden="true">·</i>');
  }

  const TYPES = { project: '프로젝트', appt: '약속', personal: '개인' };
  const typeOf = e => (TYPES[e && e.type] ? e.type : 'appt');

  /* ---------------- icons ---------------- */
  const svg = d => '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';
  const ICON = {
    left: svg('<path d="M14.5 5.5 8 12l6.5 6.5"/>'),
    right: svg('<path d="M9.5 5.5 16 12l-6.5 6.5"/>'),
    close: svg('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'),
    plus: svg('<path d="M12 5.5v13M5.5 12h13"/>'),
    star: svg('<path d="m12 3.8 2.45 5.08 5.6.68-4.13 3.86 1.07 5.53L12 16.24l-4.99 2.71 1.07-5.53L3.95 9.56l5.6-.68z"/>'),
    up: svg('<path d="m6.5 14.5 5.5-5.5 5.5 5.5"/>'),
    cal: svg('<rect x="4" y="5.5" width="16" height="14" rx="3.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>'),
    trash: svg('<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>')
  };
  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="heart" d="M12 20s-7.2-4.4-7.2-9.6A4.1 4.1 0 0 1 12 8.1a4.1 4.1 0 0 1 7.2 2.3C19.2 15.6 12 20 12 20z"/></svg>';
  const ROUTINE_BOX = SKIN.routineIcon === 'heart' ? HEART : '';
  const CUP = '<svg viewBox="0 0 24 30" aria-hidden="true"><path class="water" d="M6.1 13.5h11.8l-1.05 12.3c-.08.95-.65 1.45-1.6 1.45H8.75c-.95 0-1.52-.5-1.6-1.45z"/><path class="glass" d="M4.2 3.6h15.6L17.7 26.3c-.15 1.4-1 2.2-2.4 2.2H8.7c-1.4 0-2.25-.8-2.4-2.2z"/></svg>';
  const MOODS = ['지쳤어요', '별로예요', '그럭저럭', '좋아요', '최고예요'];
  function moodSVG(n) {
    const mouth = { 1: 'M10.5 21.5Q16 16.6 21.5 21.5', 2: 'M11 20.8Q16 18.4 21 20.8', 3: 'M11.2 19.8h9.6', 4: 'M10.8 18.6Q16 22.8 21.2 18.6', 5: 'M9.8 17.6Q16 25.2 22.2 17.6' }[n];
    const eyes = n === 5
      ? '<path d="M10.2 13.4q1.8-2.2 3.6 0M18.2 13.4q1.8-2.2 3.6 0"/>'
      : '<circle class="eye" cx="12" cy="13.2" r="1.35"/><circle class="eye" cx="20" cy="13.2" r="1.35"/>';
    const cheeks = SKIN.cheeks ? '<ellipse class="cheek" cx="9.4" cy="18.2" rx="2.3" ry="1.5"/><ellipse class="cheek" cx="22.6" cy="18.2" rx="2.3" ry="1.5"/>' : '';
    return '<svg viewBox="0 0 32 32" aria-hidden="true"><circle class="face" cx="16" cy="16" r="13"/>' + cheeks + eyes + '<path d="' + mouth + '"/></svg>';
  }

  /* ---------------- state ---------------- */
  const S = {
    view: 'today', date: today(), calMonth: today().slice(0, 7), calSel: today(),
    todoFilter: 'all', showDone: false, todoDraft: { due: 'today', star: false },
    mode: 'loading', todayStr: today(), sheet: null, lastFocus: null, readOnlyWarned: false
  };
  const D = { settings: null, days: {}, todos: {}, events: {} };

  const DEFAULT_ROUTINES = [
    { id: 'r-water', name: '일어나서 물 한 잔' },
    { id: 'r-stretch', name: '스트레칭 10분' },
    { id: 'r-vitamin', name: '영양제 챙기기' },
    { id: 'r-read', name: '책 20쪽 읽기' },
    { id: 'r-review', name: '하루 돌아보기' }
  ];
  function settings() {
    const s = D.settings || {};
    const sh = Number.isInteger(s.startHour) ? s.startHour : 6;
    const eh = Number.isInteger(s.endHour) ? s.endHour : 23;
    return {
      startHour: Math.min(Math.max(sh, 0), 23),
      endHour: Math.min(Math.max(eh, sh), 23),
      routines: Array.isArray(s.routines) ? s.routines.filter(r => r && r.id) : DEFAULT_ROUTINES
    };
  }

  const emptyDay = date => ({ date: date, goals: ['', '', ''], hours: {}, routines: {}, mood: 0, water: 0, grateful: ['', '', ''], diary: '' });
  const getDay = date => D.days[date] || null;
  const dayHasRecord = d => !!d && (
    !!str(d.diary).trim() || (d.goals || []).some(x => str(x).trim()) || Object.values(d.hours || {}).some(x => str(x).trim()) ||
    (d.grateful || []).some(x => str(x).trim()) || d.mood > 0 || d.water > 0 || Object.values(d.routines || {}).some(Boolean));
  function readBind(day, path) {
    if (!day) return '';
    const p = path.split('.'), v = day[p[0]];
    if (p.length === 1) return str(v);
    if (Array.isArray(v)) return str(v[+p[1]]);
    return v ? str(v[p[1]]) : '';
  }
  function writeBind(day, path, val) {
    const p = path.split('.');
    if (p.length === 1) { day[p[0]] = val; return; }
    if (p[0] === 'hours') {
      day.hours = Object.assign({}, day.hours);
      if (val) day.hours[p[1]] = val; else delete day.hours[p[1]];
      return;
    }
    const arr = Array.isArray(day[p[0]]) ? day[p[0]].slice() : ['', '', ''];
    arr[+p[1]] = val;
    day[p[0]] = arr;
  }

  /* events */
  const evEnd = e => (isValidDate(e.endDate) && e.endDate > e.date ? e.endDate : e.date);
  const isMulti = e => evEnd(e) > e.date;
  const eventList = () => Object.keys(D.events).map(id => Object.assign({ id: id }, D.events[id])).filter(e => isValidDate(e.date));
  const evSort = (a, b) => {
    const A = isMulti(a) || a.allDay || !a.start, B = isMulti(b) || b.allDay || !b.start;
    if (A !== B) return A ? -1 : 1;
    return str(a.start).localeCompare(str(b.start)) || str(a.title).localeCompare(str(b.title));
  };
  const eventsOn = d => eventList().filter(e => e.date <= d && evEnd(e) >= d).sort(evSort);
  function evTimeLabel(e, d) {
    if (isMulti(e)) return (diffDays(e.date, d) + 1) + '/' + (diffDays(e.date, evEnd(e)) + 1) + '일';
    if (e.allDay || !e.start) return '종일';
    return e.end ? e.start + '–' + e.end : e.start;
  }

  /* todos */
  const todoList = () => Object.keys(D.todos).map(id => Object.assign({ id: id }, D.todos[id]));
  const todoSort = (a, b) => ((b.star ? 1 : 0) - (a.star ? 1 : 0)) || ((a.createdAt || 0) - (b.createdAt || 0));
  const resolveDue = k => (k === 'today' ? today() : k === 'tomorrow' ? addDays(today(), 1) : isValidDate(k) ? k : '');
  const dueKey = d => (!d ? 'none' : d === today() ? 'today' : d === addDays(today(), 1) ? 'tomorrow' : d);
  function dueLabel(due) {
    if (!due) return '';
    const n = diffDays(today(), due);
    if (n === 0) return '오늘';
    if (n === 1) return '내일';
    if (n < 0) return fmtShort(due) + ' · ' + (-n) + '일 지남';
    return fmtShort(due);
  }
  const exampleCount = () => Object.values(D.todos).filter(x => x && x.example).length + Object.values(D.events).filter(x => x && x.example).length;

  /* ---------------- persistence ---------------- */
  const Store = {
    backend: null, timers: new Map(), inflight: new Set(), queue: new Map(),
    key: (kind, id) => kind + '/' + id,
    busy(kind, id) { const k = this.key(kind, id); return this.timers.has(k) || this.inflight.has(k) || this.queue.has(k); },
    save(kind, id, data, delay) {
      if (kind === 'settings') D.settings = data; else D[kind][id] = data;
      this.enqueue(kind, id, { op: 'set', data: data }, delay || 0);
    },
    remove(kind, id) {
      if (kind === 'settings') D.settings = null; else delete D[kind][id];
      this.enqueue(kind, id, { op: 'del' }, 0);
    },
    enqueue(kind, id, job, delay) {
      const k = this.key(kind, id);
      this.queue.set(k, Object.assign({ kind: kind, id: id }, job));
      clearTimeout(this.timers.get(k));
      this.timers.delete(k);
      if (delay > 0) this.timers.set(k, setTimeout(() => { this.timers.delete(k); this.flush(k); }, delay));
      else this.flush(k);
    },
    async flush(k) {
      if (!this.backend || this.inflight.has(k)) return;
      const job = this.queue.get(k);
      if (!job) return;
      this.queue.delete(k);
      this.inflight.add(k);
      try {
        if (job.op === 'set') await this.backend.set(job.kind, job.id, job.data);
        else await this.backend.del(job.kind, job.id);
      } catch (err) {
        onWriteError(err, job, k);
      } finally {
        this.inflight.delete(k);
        if (this.queue.has(k) && !this.timers.has(k)) this.flush(k);
      }
    },
    flushAll() {
      Array.from(this.timers.entries()).forEach(([k, t]) => { clearTimeout(t); this.timers.delete(k); });
      Array.from(this.queue.keys()).forEach(k => this.flush(k));
    }
  };

  function onWriteError(err, job, k) {
    const code = err && err.code;
    if ((code === 'unavailable' || !code) && !job.retried) {
      job.retried = true;
      setTimeout(() => { if (!Store.queue.has(k)) { Store.queue.set(k, job); Store.flush(k); } }, 700 + Math.random() * 900);
      return;
    }
    if (code === 'quota_exceeded') toast('저장 공간이 가득 찼어요. 완료한 할 일을 비우면 다시 저장할 수 있어요.');
    else if (code === 'invalid_argument') {
      if (!S.readOnlyWarned) { S.readOnlyWarned = true; toast('이 플래너는 읽기 전용으로 열려 있어서 기록이 저장되지 않아요.'); }
    } else if (code === 'revoked') toast('저장 연결이 끊겼어요. 플래너를 다시 열어 주세요.');
    else toast('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  }

  function localBackend() {
    const key = SKIN.storageKey || 'daily-planner-v1';
    let ok = true, data = null;
    try {
      data = JSON.parse(window.localStorage.getItem(key) || 'null');
      window.localStorage.setItem(key + ':probe', '1');
      window.localStorage.removeItem(key + ':probe');
    } catch (e) { ok = false; }
    data = data && typeof data === 'object' ? data : {};
    const cache = { settings: data.settings || null, days: data.days || {}, todos: data.todos || {}, events: data.events || {}, meta: data.meta || {} };
    let t = 0;
    const persist = () => {
      if (!ok) return;
      clearTimeout(t);
      t = setTimeout(() => {
        try { window.localStorage.setItem(key, JSON.stringify(cache)); }
        catch (e) { if (!S.storageWarned) { S.storageWarned = true; toast('이 기기에 저장 공간이 부족해서 기록을 저장하지 못했어요.'); } }
      }, 120);
    };
    return {
      mode: ok ? 'local' : 'memory', cache: cache,
      disable() { ok = false; clearTimeout(t); },
      set(kind, id, val) { if (kind === 'settings') cache.settings = clone(val); else cache[kind][id] = clone(val); persist(); return Promise.resolve(); },
      del(kind, id) { if (kind === 'settings') cache.settings = null; else delete cache[kind][id]; persist(); return Promise.resolve(); },
      markSeeded() { cache.meta = Object.assign({}, cache.meta, { seeded: true }); persist(); }
    };
  }

  /* First run in a browser: a few marked examples so the planner shows what it does. */
  function seedExamples() {
    const t = today(), now = Date.now();
    const events = [
      ['ex-project', { title: '예시 · 새 프로젝트 준비', type: 'project', date: addDays(t, 3), endDate: addDays(t, 7), allDay: true, start: '', end: '', place: '', memo: '여러 날에 걸친 일정은 캘린더에 띠로 보여요.' }],
      ['ex-meeting', { title: '예시 · 미팅', type: 'appt', date: t, endDate: '', allDay: false, start: '14:00', end: '15:00', place: '카페', memo: '시간을 정한 일정은 다이어리 시간표에도 나와요.' }],
      ['ex-dinner', { title: '예시 · 친구와 저녁', type: 'personal', date: addDays(t, 1), endDate: '', allDay: false, start: '19:00', end: '21:00', place: '', memo: '' }]
    ];
    const todos = [
      ['ex-star', { title: '예시 · 중요한 일은 별표로 표시해요', due: t, star: true, done: false, doneAt: 0 }],
      ['ex-done', { title: '예시 · 끝낸 일은 체크해요', due: t, star: false, done: true, doneAt: now }],
      ['ex-someday', { title: '예시 · 날짜 없는 일은 언젠가 목록에 모여요', due: '', star: false, done: false, doneAt: 0 }]
    ];
    events.forEach((x, i) => Store.save('events', x[0], Object.assign(x[1], { example: true, createdAt: now + i, updatedAt: now })));
    todos.forEach((x, i) => Store.save('todos', x[0], Object.assign(x[1], { example: true, createdAt: now + i })));
  }

  async function dbBackend() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return null;
    const caps = await Promise.all([c.use('db'), c.use('user')]);
    const db = caps[0], user = caps[1];
    if (!db || !user) return null;
    const uid = await user.id();
    if (!uid) return null;
    const base = 'data/users/' + uid;
    const settingsRef = db.doc(base + '/settings');
    const planner = db.doc(base + '/planner');
    const cols = { days: planner.collection('days'), todos: planner.collection('todos'), events: planner.collection('events') };
    const ref = (kind, id) => (kind === 'settings' ? settingsRef : cols[kind].doc(id));
    return {
      mode: 'db', settingsRef: settingsRef, cols: cols,
      set: (kind, id, val) => ref(kind, id).set(val),
      del: (kind, id) => ref(kind, id).delete()
    };
  }

  const subs = {}, winKey = {}, subRetried = {};
  function subscribeSettings(be) {
    if (subs.settings) subs.settings();
    subs.settings = be.settingsRef.onSnapshot(snap => {
      if (Store.busy('settings', 'settings')) return;
      D.settings = snap.exists ? clone(snap.data()) : null;
      scheduleRender();
    }, e => subError('settings', e));
  }
  function subscribeCol(be, kind) {
    if (subs[kind]) subs[kind]();
    subs[kind] = be.cols[kind].onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if (Store.busy(kind, id)) return;
        if (ch.type === 'removed') delete D[kind][id];
        else D[kind][id] = clone(ch.doc.data());
      });
      scheduleRender();
    }, e => subError(kind, e));
  }
  function watchDays(name, from, to) {
    const be = Store.backend;
    if (!be || be.mode !== 'db') return;
    const k = from + '~' + to;
    if (winKey[name] === k) return;
    winKey[name] = k;
    if (subs[name]) subs[name]();
    subs[name] = be.cols.days.where('date', '>=', from).where('date', '<=', to).onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === 'removed') return; // left the window; the day itself still exists
        const id = ch.doc.id;
        if (Store.busy('days', id)) return;
        D.days[id] = clone(ch.doc.data());
      });
      scheduleRender();
    }, e => subError(name, e));
  }
  function updateWindows() {
    const ws = weekStartOf(S.date);
    watchDays('daysA', addDays(ws, -7), addDays(ws, 6));
    const gs = weekStartOf(S.calMonth + '-01');
    watchDays('daysB', gs, addDays(gs, 41));
  }
  function subError(name, e) {
    const code = e && e.code;
    if (code === 'unavailable' && !subRetried[name]) {
      subRetried[name] = true;
      setTimeout(() => {
        const be = Store.backend;
        if (!be || be.mode !== 'db') return;
        if (name === 'settings') subscribeSettings(be);
        else if (name === 'todos' || name === 'events') subscribeCol(be, name);
        else { winKey[name] = ''; updateWindows(); }
      }, 3000);
    } else if (code === 'revoked') {
      toast('저장 연결이 끊겼어요. 플래너를 다시 열어 주세요.');
    }
  }

  async function initStore() {
    let be = null;
    try { be = await dbBackend(); } catch (e) { be = null; }
    if (be) {
      Store.backend = be;
      S.mode = 'db';
      subscribeSettings(be);
      subscribeCol(be, 'todos');
      subscribeCol(be, 'events');
      updateWindows();
    } else {
      const lb = localBackend();
      if (lb.cache.settings && !Store.busy('settings', 'settings')) D.settings = lb.cache.settings;
      ['days', 'todos', 'events'].forEach(kind => {
        Object.keys(lb.cache[kind]).forEach(id => { if (!Store.busy(kind, id)) D[kind][id] = lb.cache[kind][id]; });
      });
      Store.backend = lb;
      S.mode = lb.mode;
      if (!lb.cache.meta.seeded) {
        const untouched = !D.settings && !Object.keys(D.days).length && !Object.keys(D.todos).length && !Object.keys(D.events).length;
        if (untouched) seedExamples();
        lb.markSeeded();
      }
    }
    Store.flushAll();
    scheduleRender();
  }

  /* ---------------- rendering ---------------- */
  let raf = 0;
  function scheduleRender() {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; render(); });
  }
  function render() {
    renderExampleBar();
    if (S.view === 'today') renderToday();
    else if (S.view === 'todo') renderTodo();
    else renderCal();
  }

  function setView(v) {
    if (v !== 'today' && v !== 'todo' && v !== 'cal') v = 'today';
    S.view = v;
    $$('.view').forEach(el => { el.hidden = el.id !== 'view-' + v; });
    $$('[data-view]').forEach(b => { if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    render();
    window.scrollTo(0, 0);
  }

  function renderExampleBar() {
    const bar = $('#exampleBar'), n = exampleCount();
    bar.hidden = !n;
    if (n) bar.innerHTML = '<span>둘러보기용 예시 ' + n + '개가 들어 있어요. 살펴본 뒤 지워 주세요.</span><button type="button" class="mini" data-action="example-clear">예시 지우기</button>';

  function renderToday() {
    const st = settings();
    const root = $('#view-today');
    const key = S.date + '|' + st.startHour + '|' + st.endHour;
    if (root.dataset.key !== key) {
      root.innerHTML = todayShell(S.date, st);
      root.dataset.key = key;
    }
    const isToday = S.date === today();
    $('#dayRel').textContent = relLabel(S.date);
    $('#dayTodayBtn').hidden = isToday;
    const picker = $('#dayPicker');
    if (picker !== document.activeElement && picker.value !== S.date) picker.value = S.date;
    $('#weekStrip').innerHTML = weekStripHTML(S.date);
    renderHourEvents(st);
    renderDayTodos();
    renderRoutines(st);
    renderMoodWater();

    markNow();

  function weekStripHTML(date) {
    const ws = weekStartOf(date), t = today();
    let h = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), hol = HOLIDAYS[d];
      const cls = ['ws-day'];
      if (i === 0) cls.push('sun');
      if (i === 6) cls.push('sat');
      if (hol) cls.push('hol');
      if (d === t) cls.push('today');
      if (d === date) cls.push('sel');
      const types = [];
      eventsOn(d).forEach(e => { const tp = typeOf(e); if (types.indexOf(tp) < 0) types.push(tp); });
      const marks = types.slice(0, 3).map(tp => '<i class="type-' + tp + '"></i>').join('') + (dayHasRecord(D.days[d]) ? '<i class="rec"></i>' : '');
      h += '<button type="button" class="' + cls.join(' ') + '" data-action="go-date" data-date="' + d + '" aria-label="' + fmtMD(d) + (hol ? ', ' + hol : '') + '"' + (d === date ? ' aria-current="date"' : '') + '>' +
        '<span class="ws-wd">' + WD[i] + '</span><span class="ws-num">' + parse(d).getDate() + '</span><span class="ws-marks">' + marks + '</span></button>';
    }
    return h;
  }

  const chipHTML = (e, d) => '<button type="button" class="ev-chip type-' + typeOf(e) + '" data-action="edit-event" data-id="' + esc(e.id) + '"><span class="ev-time">' + esc(evTimeLabel(e, d)) + '</span><span class="ev-title">' + esc(e.title) + '</span></button>';

  function renderHourEvents(st) {
    const evs = eventsOn(S.date), allDay = [], byHour = {};
    evs.forEach(e => {
      if (isMulti(e) || e.allDay || !e.start) { allDay.push(e); return; }
      const h = parseInt(e.start.slice(0, 2), 10);
      if (!(h >= st.startHour && h <= st.endHour)) { allDay.push(e); return; }
      (byHour[h] = byHour[h] || []).push(e);
    });
    const ad = $('#allDay');
    ad.innerHTML = allDay.map(e => chipHTML(e, S.date)).join('');
    ad.hidden = !allDay.length;
    for (let h = st.startHour; h <= st.endHour; h++) {
      const el = $('#hev' + h);
      if (!el) continue;
      const list = byHour[h] || [];
      el.innerHTML = list.map(e => chipHTML(e, S.date)).join('');
      el.hidden = !list.length;
    }
  }

  const todoItemHTML = (t, showDue) => {
    const late = t.due && t.due < today() && !t.done;
    const meta = (t.star ? '<span class="t-star">' + ICON.star + '중요</span>' : '') +
      (showDue && t.due ? '<span class="t-due' + (late ? ' late' : '') + '">' + esc(dueLabel(t.due)) + '</span>' : '');
    return '<li class="todo' + (t.done ? ' done' : '') + (t.star ? ' starred' : '') + '">' +
      '<label class="check"><input type="checkbox" data-todo="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + ' aria-label="' + esc(t.title) + ' 완료"><span class="box" aria-hidden="true"></span></label>' +
      '<button type="button" class="todo-text" data-action="edit-todo" data-id="' + esc(t.id) + '"><span class="t-title">' + esc(t.title) + '</span>' + (meta ? '<span class="t-meta">' + meta + '</span>' : '') + '</button>' +
    '</li>';
  };

  function renderDayTodos() {
    const list = todoList().filter(t => t.due === S.date).sort((a, b) => ((a.done ? 1 : 0) - (b.done ? 1 : 0)) || todoSort(a, b));
    $('#dayTodos').innerHTML = list.length ? list.map(t => todoItemHTML(t, false)).join('') : '<li class="empty">이 날 할 일이 아직 없어요.</li>';
    const done = list.filter(t => t.done).length;
    $('#dayTodoCount').textContent = list.length ? done + '/' + list.length : '';
    const hint = $('#overHint');

  }

  function renderRoutines(st) {
    const day = getDay(S.date) || {}, done = day.routines || {};
    const last7 = [];
    for (let i = 6; i >= 0; i--) last7.push(addDays(S.date, -i));
    $('#routines').innerHTML = st.routines.length ? st.routines.map(r => {
      const on = !!done[r.id];
      const hist = last7.map(d => !!(D.days[d] && D.days[d].routines && D.days[d].routines[r.id]));
      const cnt = hist.filter(Boolean).length;
      return '<li class="routine' + (on ? ' on' : '') + '">' +
        '<label class="check rcheck"><input type="checkbox" data-routine="' + esc(r.id) + '"' + (on ? ' checked' : '') + '><span class="box" aria-hidden="true">' + ROUTINE_BOX + '</span><span class="r-name">' + esc(r.name) + '</span></label>' +
        '<span class="r-hist" role="img" aria-label="최근 7일 중 ' + cnt + '일 실천" title="최근 7일 중 ' + cnt + '일">' + hist.map((x, i) => '<i class="' + (x ? 'on' : '') + (i === 6 ? ' cur' : '') + '"></i>').join('') + '</span>' +
      '</li>';
    }).join('') : '<li class="empty">편집을 눌러 매일 할 루틴을 정해 보세요.</li>';
    const n = st.routines.filter(r => done[r.id]).length;
    $('#routineCount').textContent = st.routines.length ? n + '/' + st.routines.length : '';
  }

  function renderMoodWater() {
    const day = getDay(S.date) || {};
    const dots = SKIN.moodStyle === 'dots', bars = SKIN.waterStyle === 'bars';
    $('#moods').innerHTML = MOODS.map((label, i) => '<button type="button" class="mood' + (dots ? ' mood-dot' : '') + '" data-mood="' + (i + 1) + '" aria-pressed="' + (day.mood === i + 1) + '" aria-label="' + label + '" title="' + label + '">' + (dots ? '<span class="md" aria-hidden="true"></span>' : moodSVG(i + 1)) + '</button>').join('');
    $('#moodLabel').textContent = day.mood ? MOODS[day.mood - 1] : '';
    const w = Math.min(Math.max(day.water || 0, 0), 8);
    let cups = '';
    for (let i = 0; i < 8; i++) cups += '<button type="button" class="cup' + (bars ? ' cup-bar' : '') + (i < w ? ' full' : '') + '" data-cup="' + (i + 1) + '" aria-label="물 ' + (i + 1) + '잔" aria-pressed="' + (i < w) + '">' + (bars ? '<span class="wb" aria-hidden="true"></span>' : CUP) + '</button>';
    $('#cups').innerHTML = cups;
    $('#waterCount').textContent = w;
  }

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.max(el.scrollHeight, 152) + 'px';
  }

  function patchBinds(root) {
    const day = getDay(S.date);
    $$('[data-bind]', root).forEach(el => {
      if (el === document.activeElement) return;
      const v = readBind(day, el.dataset.bind);
      if (el.value !== v) el.value = v;
      if (el.tagName === 'TEXTAREA') autoGrow(el);
    });
    $$('.hour-row', root).forEach(row => {
      const inp = row.querySelector('input');
      const ev = row.querySelector('.h-events');
      row.classList.toggle('filled', !!(inp && inp.value.trim()) || !!(ev && !ev.hidden));
    });
  }

  function markNow() {
    const root = $('#view-today');
    $$('.hour-row.now', root).forEach(r => r.classList.remove('now'));
    if (S.date !== today()) return;
    const row = root.querySelector('.hour-row[data-hour="' + new Date().getHours() + '"]');
    if (row) row.classList.add('now');
  }

  /* ----- todo tab ----- */
  function dueChipsHTML(group, due) {
    const custom = isValidDate(due);
    return '<div class="seg-chips due-chips" data-due-group="' + group + '">' +
      '<button type="button" class="chip" data-due="today" aria-pressed="' + (due === 'today') + '">오늘</button>' +
      '<button type="button" class="chip" data-due="tomorrow" aria-pressed="' + (due === 'tomorrow') + '">내일</button>' +
      '<button type="button" class="chip" data-due="none" aria-pressed="' + (due === 'none') + '">날짜 없음</button>' +

    '</div>';

  function todoShell() {
    const filters = [['all', '전체'], ['today', '오늘'], ['upcoming', '예정'], ['someday', '언젠가'], ['done', '완료']];
    return '<div class="view-head"><h1 class="view-title">할 일</h1><p class="view-sub" id="todoStats"></p></div>' +
      '<form class="card todo-add" id="todoForm" autocomplete="off">' +
        '<div class="add-row first">' +
          '<input class="line-input" type="text" id="todoInput" placeholder="무엇을 해야 하나요?" maxlength="120" enterkeyhint="done" aria-label="새 할 일">' +
          '<button type="button" class="star-toggle" id="todoStar" data-action="star-draft" aria-pressed="false" aria-label="중요 표시">' + ICON.star + '</button>' +
          '<button class="btn primary" type="submit">추가</button>' +
        '</div>' +
        '<div id="todoDueRow"></div>' +
      '</form>' +
      '<div class="seg" role="tablist" aria-label="할 일 보기" id="todoFilters">' + filters.map(f => '<button type="button" role="tab" data-filter="' + f[0] + '" aria-selected="false">' + f[1] + '</button>').join('') + '</div>' +
      '<div class="todo-groups" id="todoGroups"></div>';

  function renderTodo() {
    const root = $('#view-todo');
    if (!root.dataset.built) { root.innerHTML = todoShell(); root.dataset.built = '1'; }
    renderTodoForm();
    $$('[data-filter]', root).forEach(b => b.setAttribute('aria-selected', String(b.dataset.filter === S.todoFilter)));
    const t = today(), open = todoList().filter(x => !x.done);
    const nToday = open.filter(x => x.due === t).length, nOver = open.filter(x => x.due && x.due < t).length;
    $('#todoStats').textContent = open.length ? '남은 일 ' + open.length + '개 · 오늘 ' + nToday + '개' + (nOver ? ' · 지난 일 ' + nOver + '개' : '') : '남은 할 일이 없어요.';
    renderTodoGroups();

  function renderTodoForm() {
    const row = $('#todoDueRow');
    if (!row) return;
    row.innerHTML = dueChipsHTML('nd', S.todoDraft.due);
    $('#todoStar').setAttribute('aria-pressed', String(!!S.todoDraft.star));
  }

  function renderTodoGroups() {
    const t = today(), tm = addDays(t, 1), f = S.todoFilter;
    const all = todoList(), open = all.filter(x => !x.done);
    const byDue = (a, b) => a.due.localeCompare(b.due) || todoSort(a, b);
    const over = open.filter(x => x.due && x.due < t).sort(byDue);
    const tod = open.filter(x => x.due === t).sort(todoSort);
    const tmr = open.filter(x => x.due === tm).sort(todoSort);
    const later = open.filter(x => x.due && x.due > tm).sort(byDue);
    const none = open.filter(x => !x.due).sort(todoSort);
    const done = all.filter(x => x.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    const G = [];
    const add = (title, items, o) => G.push(Object.assign({ title: title, items: items }, o || {}));
    if (f === 'all' || f === 'today') {
      if (over.length) add('지난 할 일', over, { due: true, tool: '<button type="button" class="mini" data-action="over-to-today">모두 오늘로</button>' });
      add('오늘', tod, { empty: '오늘 할 일이 없어요. 위에서 추가해 보세요.' });
    }
    if (f === 'all' || f === 'upcoming') {
      if (tmr.length || f === 'upcoming') add('내일', tmr, { empty: '내일 할 일이 없어요.' });
      if (later.length || f === 'upcoming') add('예정', later, { due: true, empty: '날짜를 정해 둔 할 일이 여기에 모여요.' });
    }
    if ((f === 'all' && none.length) || f === 'someday') add('언젠가', none, { empty: '날짜 없이 적어 둔 할 일이 여기에 모여요.' });
    if (f === 'done') add('완료', done, { due: true, empty: '아직 완료한 일이 없어요.', tool: done.length ? '<button type="button" class="mini" data-action="clear-done">완료 항목 비우기</button>' : '' });
    let html = G.map(g => '<section class="card todo-group"><h2 class="sec-title"><span>' + g.title + '</span><span class="sec-tools"><span class="count">' + (g.items.length || '') + '</span>' + (g.tool || '') + '</span></h2>' +
      (g.items.length ? '<ul class="todo-list">' + g.items.map(x => todoItemHTML(x, !!g.due)).join('') + '</ul>' : '<p class="empty">' + (g.empty || '') + '</p>') + '</section>').join('');
    if (f === 'all' && done.length) {
      html += '<button type="button" class="done-toggle" data-action="toggle-done" aria-expanded="' + S.showDone + '">완료한 일 ' + done.length + '개 ' + (S.showDone ? '접기' : '보기') + '</button>';
      if (S.showDone) html += '<section class="card todo-group"><ul class="todo-list">' + done.slice(0, 60).map(x => todoItemHTML(x, true)).join('') + '</ul></section>';
    }
    $('#todoGroups').innerHTML = html;
  }

  /* ----- calendar ----- */
  function calShell() {
    return '<div class="cal-head">' +
        '<button type="button" class="nav-arrow" data-action="cal-prev" aria-label="이전 달" title="이전 달 (←)">' + ICON.left + '</button>' +
        '<h1 class="cal-title" id="calTitle"><span class="cal-m" id="calM"></span><span class="cal-meta"><span class="cal-en" id="calEn"></span><span class="cal-y" id="calY"></span></span></h1>' +
        '<button type="button" class="nav-arrow" data-action="cal-next" aria-label="다음 달" title="다음 달 (→)">' + ICON.right + '</button>' +
        '<button type="button" class="chip cal-today" data-action="cal-today" id="calTodayBtn">오늘</button>' +
      '</div>' +
      '<div class="cal-layout">' +
        '<div class="card cal-card">' +
          '<div class="cal-wd" aria-hidden="true">' + WD.map((w, i) => '<span class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</span>').join('') + '</div>' +
          '<div class="cal-weeks" id="calWeeks"></div>' +
          '<div class="cal-legend">' + Object.keys(TYPES).map(k => '<span class="lg type-' + k + '"><i></i>' + TYPES[k] + '</span>').join('') + '<span class="lg lg-hol"><i></i>공휴일</span><span class="lg lg-rec"><i></i>기록한 날</span></div>' +
        '</div>' +
