name: folio-windows-test
on:
  push:
    branches: [folio-windows-test]
    paths: [Folio.exe, .github/workflows/folio-windows-test.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $os = (Get-CimInstance Win32_OperatingSystem).Caption + ' ' + [Environment]::OSVersion.Version
          $net = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release
          $k = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $wv = if (Test-Path $k) { (Get-ItemProperty $k).pv } else { 'missing' }
          "os=$os`nnetfx_release=$net`nwebview2=$wv`nsession=$([Environment]::UserInteractive)" | Tee-Object out\env.txt
          if ($wv -eq 'missing') {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile wv2setup.exe
            Start-Process .\wv2setup.exe -ArgumentList '/silent','/install' -Wait
            "webview2 after install=$((Get-ItemProperty $k -ErrorAction SilentlyContinue).pv)" | Tee-Object out\env.txt -Append
          }
      - name: Self-test (two runs, portable)
        shell: pwsh
        run: |
          foreach ($i in 1,2) {
            $p = Start-Process -FilePath .\Folio.exe -ArgumentList '--selftest',"$PWD\out" -PassThru
            if (-not $p.WaitForExit(150000)) { "run$i timeout" | Tee-Object out\summary.txt -Append; Stop-Process -Id $p.Id -Force }
            else { "run$i exit=$($p.ExitCode)" | Tee-Object out\summary.txt -Append }
            Start-Sleep 4
          }
      - name: Install, open twice, close, uninstall
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Folio\Folio.exe"
          $p = Start-Process .\Folio.exe -ArgumentList '--install','--silent' -PassThru -Wait
          $lnkStart = Join-Path ([Environment]::GetFolderPath('Programs')) 'Folio.lnk'
          $lnkDesk = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Folio.lnk'
          $reg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Folio' -ErrorAction SilentlyContinue
          $zone = Get-Item $exe -Stream Zone.Identifier -ErrorAction SilentlyContinue
          "install exit=$($p.ExitCode) exe=$(Test-Path $exe) start_lnk=$(Test-Path $lnkStart) desk_lnk=$(Test-Path $lnkDesk) uninstall_entry=$($reg.DisplayName) cmd=$($reg.UninstallString) zone=$([bool]$zone)" | Tee-Object out\summary.txt -Append
          $sh = New-Object -ComObject WScript.Shell
          "lnk_target=$($sh.CreateShortcut($lnkStart).TargetPath) icon=$($sh.CreateShortcut($lnkStart).IconLocation)" | Tee-Object out\summary.txt -Append
          $a = Start-Process $exe -PassThru
          Start-Sleep 12
          $b = Start-Process $exe -PassThru
          $bQuit = $b.WaitForExit(10000)
          "second launch exited=$bQuit code=$(if ($bQuit) { $b.ExitCode })  first still running=$(-not $a.HasExited)" | Tee-Object out\summary.txt -Append
          Add-Type -AssemblyName System.Windows.Forms
          $a.Refresh(); "main window title=$($a.MainWindowTitle)" | Tee-Object out\summary.txt -Append
          [void]$a.CloseMainWindow()
          $aQuit = $a.WaitForExit(15000)
          "close exited=$aQuit" | Tee-Object out\summary.txt -Append
          if (-not $aQuit) { Stop-Process -Id $a.Id -Force }
          $u = Start-Process $exe -ArgumentList '--uninstall','--silent' -PassThru -Wait
          Start-Sleep 8
          $reg2 = Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Folio'
          "uninstall exit=$($u.ExitCode) exe_left=$(Test-Path $exe) dir_left=$(Test-Path (Split-Path $exe)) start_lnk_left=$(Test-Path $lnkStart) desk_lnk_left=$(Test-Path $lnkDesk) entry_left=$reg2 records_kept=$(Test-Path "$env:LOCALAPPDATA\Folio\WebView2")" | Tee-Object out\summary.txt -Append
      - name: Collect
        if: always()
        shell: pwsh
        run: |
          Copy-Item "$env:LOCALAPPDATA\Folio\log.txt" out\log.txt -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\Folio\window.txt" out\window.txt -ErrorAction SilentlyContinue
          $docs = [Environment]::GetFolderPath('MyDocuments')
          Get-ChildItem (Join-Path $docs 'Folio 백업') -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName) $($_.Length)" } | Out-File out\backups.txt -Encoding utf8
          $auto = Get-ChildItem (Join-Path $docs 'Folio 백업\자동 백업') -Filter *.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($auto) { Copy-Item $auto.FullName out\auto-backup-sample.json }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git commit -m "windows test results" -q
          git push -q origin HEAD:folio-windows-test
